  ['KUA/Catatan Sipil','Formulir N3 – Persetujuan Calon Pengantin',45,'Kedua mempelai','Ditandatangani kedua calon pengantin.'],
  ['KUA/Catatan Sipil','Formulir N4 – Izin Orang Tua',45,'Orang tua','Wajib jika calon pengantin belum berusia 21 tahun.'],
  ['KUA/Catatan Sipil','Surat rekomendasi nikah (jika akad di luar domisili)',45,'KUA domisili','Diminta ke KUA domisili bila akad dilaksanakan di kecamatan lain.'],
  ['Kesehatan','Surat keterangan sehat & imunisasi TT',40,'Puskesmas','Diperoleh dari puskesmas setelah pemeriksaan calon pengantin.'],
  ['KUA/Catatan Sipil','Pendaftaran nikah ke KUA',30,'Kedua mempelai','Daftar paling lambat 10 hari kerja sebelum akad. Lebih aman 1 bulan sebelumnya.'],
  ['KUA/Catatan Sipil','Bukti bayar biaya nikah di luar KUA (jika ada)',21,'Kedua mempelai','Nikah di luar kantor/jam kerja KUA dikenakan biaya PNBP yang dibayar lewat bank.'],
  ['Keagamaan','Sertifikat Bimbingan Perkawinan (Bimwin)',21,'Kedua mempelai','Catat jadwal Bimwin atau bimbingan perkawinan dari KUA.'],
];
const KUA_FLOW = [
  'Minta surat pengantar dari RT/RW.',
  'Lengkapi berkas identitas kedua calon pengantin.',
  'Urus formulir N1–N4 melalui kelurahan/desa.',
  'Lakukan pemeriksaan kesehatan & imunisasi TT di puskesmas.',
  'Daftarkan kehendak nikah ke KUA (min. 10 hari kerja sebelum akad).',
  'Bayar biaya nikah bila akad di luar KUA/jam kerja.',
  'Ikuti Bimbingan Perkawinan (Bimwin), lalu pemeriksaan berkas oleh penghulu.',
];
const docStatus = d => d.done ? 'lengkap' : (d.status==='proses' ? 'proses' : 'belum');
const D_STATUS_LABEL = { belum:'Belum ada', proses:'Proses', lengkap:'Lengkap' };
const D_STATUS_TONE = { belum:'rust', proses:'gold', lengkap:'green' };

function DocumentsPage({ docs, setDocs, onBack, goPage, data }) {
  const [search, setSearch] = useState('');
  const [fKat, setFKat] = useState('semua');
  const [fStatus, setFStatus] = useState('semua');
  const [fPic, setFPic] = useState('semua');
  const [draft, setDraft] = useState(null);
  const [showFlow, setShowFlow] = useState(false);
  const [tplMsg, setTplMsg] = useState('');

  const lengkap = docs.filter(d=>d.done).length;
  const proses = docs.filter(d=>docStatus(d)==='proses').length;
  const belum = docs.filter(d=>docStatus(d)==='belum').length;
  const late = docs.filter(d=>!d.done && isLateDisp(d.deadlineDisplay)).length;
  const pct = docs.length ? Math.round(lengkap/docs.length*100) : 0;
  const cats = uniqOpts([...DOC_CATS, ...docs.map(d=>d.cat)]);
  const pics = uniqOpts(docs.map(d=>d.pic));

  const save = patch => setDocs(p=>p.map(d=>d.id===patch.id?{...d,...patch}:d));
  const toggle = d => { save({ id:d.id, done:!d.done, status: d.done ? 'proses' : d.status }); toast(d.done ? 'Dokumen dibuka lagi' : 'Dokumen lengkap', d.done ? 'Status kembali ke proses.' : 'Satu langkah lebih dekat ke hari bahagia.'); };
  const remove = d => { if (!confirmHapus('dokumen', d.name)) return; if (d.fileUrl) { try { URL.revokeObjectURL(d.fileUrl); } catch(e) {} } setDocs(p=>p.filter(x=>x.id!==d.id)); toast('Dokumen dihapus', 'Daftar dokumen sudah diperbarui.'); };

  const useKua = () => {
    const have = new Set(docs.map(d=>(d.name||'').trim().toLowerCase()));
    const base = Date.now();
    const fresh = KUA_TEMPLATE.filter(([,n])=>!have.has(n.toLowerCase())).map(([cat,name,days,pic,note],i)=>({
      id:base+i, name, cat, status:'belum', done:false, deadlineDisplay: deadlineFrom(data, days), pic, note, link:'', fileUrl:null, fileName:'', fileType:'',
    }));
    if (!fresh.length) { setTplMsg('Semua dokumen dari template Administrasi KUA sudah ada.'); return; }
    setTplMsg(''); setDocs(p=>[...p, ...fresh]); toast('Template KUA ditambahkan', `${fresh.length} dokumen lengkap dengan deadline & PIC.`);
  };

  const openNew = () => setDraft({ __new:true, id:Date.now(), name:'', cat:'Identitas', status:'belum', deadlineDisplay:'', pic:'', link:'', note:'', fileUrl:null, fileName:'', fileType:'' });
  const openEdit = d => setDraft({ link:'', note:'', pic:'', deadlineDisplay:'', ...d, status: docStatus(d) });
  const setD = (k,v) => setDraft(d=>({...d,[k]:v}));
  const commit = () => {
    if (!draft.name.trim()) { alert('Nama dokumen wajib diisi.'); return; }
    const { __new, ...d } = draft;
    const item = { ...d, name:d.name.trim(), done: d.status==='lengkap', status: d.status==='lengkap' ? 'proses' : d.status };
    if (__new) setDocs(p=>[...p, item]); else save(item);
    setDraft(null); toast(__new ? 'Dokumen ditambahkan' : 'Dokumen tersimpan');
  };
  const onPick = file => { const f = pickFile(file); if (!f) return; setDraft(d=>({...d, fileUrl:f.url, fileName:f.name, fileType:f.type})); };

  const q = search.trim().toLowerCase();
  const shown = docs
    .filter(d => !q || [d.name,d.pic,d.note,d.cat].some(x=>(x||'').toLowerCase().includes(q)))
    .filter(d => fKat==='semua' || d.cat===fKat)
    .filter(d => fStatus==='semua' || docStatus(d)===fStatus || (fStatus==='lewat' && !d.done && isLateDisp(d.deadlineDisplay)))
    .filter(d => fPic==='semua' || d.pic===fPic)
    .sort((a,b)=>(displayToIso(a.deadlineDisplay||'')||'9999').localeCompare(displayToIso(b.deadlineDisplay||'')||'9999'));

  return (
    <div>
      <ModHero eyebrow="Janji Suci Dokumen" title="Dokumen & Administrasi"
        desc="Kelola dokumen identitas, KUA/catatan sipil, vendor, pembayaran, rundown, layout venue, dan file penting lain."
        actions={[{label:'Tambah Dokumen', primary:true, onClick:openNew}]} goPage={goPage}/>

      <div className="card p-5 lg:p-7 mb-4 grid grid-cols-1 lg:grid-cols-2 gap-5 items-center">
        <div>
          <p className="text-xs mb-1" style={{color:'#7a9482'}}>Progress Kelengkapan</p>
          <p className="mod-title text-4xl">{pct}%</p>
          <p className="text-xs mt-1" style={{color:'#9db09f'}}>{lengkap} dari {docs.length} dokumen lengkap</p>
        </div>
        <div>
          <div className="flex justify-between text-xs mb-2"><span style={{color:'#7a9482'}}>Kelengkapan dokumen</span><b style={{color:'var(--gold)'}}>{pct}%</b></div>
          <div className="prog-track" style={{height:'10px'}}><div className="prog-fill" style={{width:`${pct}%`}}/></div>
          {late>0
            ? <p className="text-xs mt-2 font-semibold" style={{color:'var(--rust)'}}>Peringatan: {late} dokumen melewati deadline dan belum lengkap.</p>
            : <p className="text-xs mt-2" style={{color:'#9db09f'}}>Tidak ada dokumen yang lewat deadline.</p>}
        </div>
      </div>

      <StatGrid items={[
        {label:'Total Dokumen', value:docs.length, sub:'Semua kategori'},
        {label:'Lengkap', value:lengkap, sub:'Sudah aman'},
        {label:'Proses', value:proses, sub:'Sedang dilengkapi'},
        {label:'Belum Ada', value:belum, sub:`${late} lewat deadline`, subColor: late?'var(--rust)':null},
      ]}/>

      <div className="card p-5 lg:p-7 mb-4">
        <div className="flex flex-wrap items-start justify-between gap-4 mb-4">
          <div style={{flex:'1 1 320px'}}>
            <p className="text-[11px] font-bold mb-1" style={{color:'var(--sage-dark)'}}>Template Dokumen</p>
            <h3 className="mod-title text-2xl mb-1">Administrasi KUA</h3>
            <p className="text-xs" style={{color:'#9db09f',lineHeight:1.6}}>Tambahkan daftar berkas KUA yang umum dibutuhkan, lengkap dengan PIC, catatan, dan deadline yang dihitung otomatis dari tanggal akad.</p>
          </div>
          <button onClick={useKua} className="mod-btn mod-btn-primary">Gunakan Template KUA</button>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
          {[
            ['Berkas Identitas','KTP, KK, akta kelahiran/ijazah, pas foto, dan KTP wali & saksi.'],
            ['Formulir KUA','Surat pengantar RT/RW, formulir N1–N4, rekomendasi nikah, dan pendaftaran ke KUA.'],
            ['Puskesmas & Bimwin','Surat sehat & imunisasi TT, bukti bayar nikah di luar KUA, dan bimbingan perkawinan.'],
          ].map(([h,t])=>(
            <div key={h}><p className="text-xs font-bold mb-1" style={{color:'var(--gold)'}}>{h}</p><p className="text-xs" style={{color:'#7a9482',lineHeight:1.6}}>{t}</p></div>
          ))}
        </div>
        <button onClick={()=>setShowFlow(s=>!s)} className="text-xs font-bold" style={{color:'var(--gold)',background:'none',border:'none',cursor:'pointer'}}>{showFlow?'▾':'▸'} Lihat alur singkat pengurusan KUA</button>
        {showFlow && (
          <ol className="mt-2 space-y-1.5 anim-fadeup" style={{paddingLeft:'18px',listStyle:'decimal'}}>
            {KUA_FLOW.map((s,i)=><li key={i} className="text-xs" style={{color:'#5a7a5d'}}>{s}</li>)}
            <li className="text-[11px] list-none -ml-4 mt-2" style={{color:'#9db09f'}}>Syarat bisa sedikit berbeda per daerah — konfirmasi ke KUA kecamatan setempat.</li>
          </ol>
        )}
        {tplMsg && <p className="text-xs mt-3 font-semibold" style={{color:'var(--rust)'}}>{tplMsg}</p>}
      </div>

      <FilterBar search={search} setSearch={setSearch} placeholder="Cari dokumen, PIC, catatan…" selects={[
        {value:fKat, set:setFKat, label:'Kategori', options:[['semua','Semua kategori'], ...cats.map(c=>[c,c])]},
        {value:fStatus, set:setFStatus, label:'Status', options:[['semua','Semua status'],['belum','Belum ada'],['proses','Proses'],['lengkap','Lengkap'],['lewat','Lewat deadline']]},
        {value:fPic, set:setFPic, label:'PIC', options:[['semua','Semua PIC'], ...pics.map(p=>[p,p])]},
      ]}/>

      {docs.length===0 ? (
        <EmptyMod icon="📄" text="Belum ada dokumen. Gunakan Template KUA atau tambah sendiri." action={{label:'Tambah Dokumen', onClick:openNew}}/>
      ) : shown.length===0 ? (
        <EmptyMod icon="🔍" text="Tidak ada dokumen yang cocok dengan filter."/>
      ) : (
        <div className="space-y-3">
          {shown.map(d=>{
            const st = docStatus(d); const lt = !d.done && isLateDisp(d.deadlineDisplay);
            return (
              <ModItem key={d.id} accent={d.done?'#3fa35f':lt?'var(--rust)':st==='proses'?'var(--gold)':'#e3a7a0'}
                chips={<><Chip>{d.cat}</Chip><Chip tone={D_STATUS_TONE[st]}>{D_STATUS_LABEL[st]}</Chip>{lt && <Chip tone="rust">deadline lewat</Chip>}</>}
                title={d.name} titleColor={d.done?'#23854a':null}
                meta={[d.deadlineDisplay && `Deadline: ${dispShort(d.deadlineDisplay)}`, d.pic && `PIC: ${d.pic}`]}
                desc={d.note}
                actions={[
                  {label: d.done?'Buka Lagi':'Tandai Lengkap', primary:!d.done, onClick:()=>toggle(d)},
                  {label:'Edit', onClick:()=>openEdit(d)},
                  {label:'Hapus', danger:true, onClick:()=>remove(d)},
                ]}>
                {(d.link || d.fileUrl) && (
                  <div className="flex flex-wrap gap-2 mt-3">
                    {d.link && <a href={webUrl(d.link)} target="_blank" rel="noopener noreferrer" className="mod-btn mod-btn-soft mod-btn-sm">Buka link file</a>}
                    {d.fileUrl && <a href={d.fileUrl} target="_blank" rel="noopener noreferrer" className="mod-btn mod-btn-soft mod-btn-sm">File: {d.fileName}</a>}
                  </div>
                )}
              </ModItem>
            );
          })}
        </div>
      )}

      <Modal open={!!draft} title={draft?.__new ? 'Tambah Dokumen' : 'Edit Dokumen'} sub="Isi nama dokumen, kategori, status, PIC, deadline, dan link file."
        onClose={()=>setDraft(null)} onSave={commit} saveLabel={draft?.__new ? 'Tambah Dokumen' : 'Simpan Perubahan'}>
        {draft && (
          <div className="mod-form">
            <Fld label="Nama Dokumen" span2><TextIn value={draft.name} onChange={v=>setD('name',v)} placeholder="Contoh: Surat keterangan domisili"/></Fld>
            <Fld label="Kategori"><CatSelect value={draft.cat} onChange={v=>setD('cat',v)} options={cats}/></Fld>
            <Fld label="Status"><Sel value={draft.status} onChange={v=>setD('status',v)} options={[['belum','Belum ada'],['proses','Proses'],['lengkap','Lengkap']]}/></Fld>
            <Fld label="Deadline"><DateField value={draft.deadlineDisplay||''} onChange={v=>setD('deadlineDisplay',v)}/></Fld>
            <Fld label="PIC"><TextIn value={draft.pic} onChange={v=>setD('pic',v)} placeholder="Contoh: Kelurahan, CPW & CPP"/></Fld>
            <Fld label="Link File Dokumen" hint="Bisa isi link Google Drive, Dropbox, atau link file lain yang bisa dibuka." span2><TextIn value={draft.link} onChange={v=>setD('link',v)} placeholder="https://drive.google.com/…" inputMode="url"/></Fld>
            <Fld label="Upload Foto / Scan" span2><FileField name={draft.fileName} url={draft.fileUrl} type={draft.fileType} onPick={onPick} onRemove={()=>setDraft(d=>({...d,fileUrl:null,fileName:'',fileType:''}))} label="Upload foto atau scan"/></Fld>
            <Fld label="Catatan" span2><Txt value={draft.note} onChange={v=>setD('note',v)} placeholder="Catatan tambahan" rows={2}/></Fld>
          </div>
        )}
      </Modal>
    </div>
  );
}

const SES_TEMPLATE = [
  ['Mahar','Mahar (uang / emas / logam mulia)'],
  ['Mahar','Cincin nikah'],
  ['Perlengkapan Ibadah','Seperangkat alat sholat'],
  ['Perlengkapan Ibadah','Al-Qur\'an'],
  ['Perlengkapan Ibadah','Sajadah'],
  ['Pakaian','Kain / bahan baju'],
  ['Pakaian','Gamis atau dress'],
  ['Pakaian','Pakaian dalam'],
  ['Pakaian','Hijab / kerudung'],
  ['Kosmetik/Skincare','Skincare'],
  ['Kosmetik/Skincare','Make up set'],
  ['Kosmetik/Skincare','Parfum'],
  ['Aksesoris','Jam tangan'],
  ['Aksesoris','Perhiasan'],
  ['Sepatu/Tas','Sepatu'],
  ['Sepatu/Tas','Tas'],
  ['Makanan/Kue','Kue / jajanan tradisional'],
  ['Makanan/Kue','Buah-buahan'],
  ['Hobi','Item hobi pasangan'],
  ['Lainnya','Box / wadah seserahan'],
];

function SeserahanPage({ items, setItems, onBack, goPage }) {
  const [search, setSearch] = useState('');
  const [fKat, setFKat] = useState('semua');
  const [fStatus, setFStatus] = useState('semua');
  const [draft, setDraft] = useState(null);

  const total = it => (Number(it.harga)||0)*(Number(it.qty)||1);
  const rencana = items.reduce((a,it)=>a+total(it),0);
  const bayar = items.reduce((a,it)=>a+(Number(it.bayar)||0),0);
  const sudah = items.filter(it=>it.status==='sudah').length;
  const pct = items.length ? Math.round(sudah/items.length*100) : 0;
  const cats = uniqOpts([...SCATS, ...items.map(i=>i.cat)]);

  const save = patch => setItems(p=>p.map(x=>x.id===patch.id?{...x,...patch}:x));
  const toggle = it => { const st = it.status==='sudah'?'belum':'sudah'; save({ id:it.id, status:st, bayar: st==='sudah' && !Number(it.bayar) ? total(it) : it.bayar }); toast(st==='sudah'?'Sudah dibeli':'Ditandai belum beli', `${it.name||'Item'} diperbarui.`); };
  const remove = it => { if (!confirmHapus('item seserahan', it.name)) return; if (it.buktiUrl) { try { URL.revokeObjectURL(it.buktiUrl); } catch(e) {} } setItems(p=>p.filter(x=>x.id!==it.id)); toast('Item dihapus', 'Daftar seserahan sudah diperbarui.'); };

  const applyTemplate = () => {
    const have = new Set(items.map(i=>(i.name||'').trim().toLowerCase()));
    const base = Date.now();
    const fresh = SES_TEMPLATE.filter(([,n])=>!have.has(n.toLowerCase())).map(([cat,name],i)=>({ id:base+i, cat, name, varian:'', harga:'', qty:1, bayar:'', status:'belum', link:'', note:'', buktiUrl:null, buktiName:'', buktiType:'' }));
    if (!fresh.length) { toast('Template sudah lengkap', 'Semua item template sudah ada di daftar.'); return; }
    setItems(p=>[...p, ...fresh]); toast('Template ditambahkan', `${fresh.length} item mahar & seserahan siap diisi.`);
  };

  const openNew = () => setDraft({ __new:true, id:Date.now(), cat:'Aksesoris', name:'', varian:'', link:'', harga:'', qty:1, bayar:'', status:'belum', note:'', buktiUrl:null, buktiName:'', buktiType:'' });
  const openEdit = it => setDraft({ note:'', ...it });
  const setD = (k,v) => setDraft(d=>({...d,[k]:v}));
  const commit = () => {
    if (!draft.name.trim()) { alert('Nama barang wajib diisi.'); return; }
    const { __new, ...d } = draft;
    const item = { ...d, name:d.name.trim(), qty: Math.max(1, Number(d.qty)||1) };
    if (__new) setItems(p=>[...p, item]); else save(item);
    setDraft(null); toast(__new ? 'Item ditambahkan' : 'Item tersimpan');
  };
  const onPick = file => { const f = pickFile(file); if (!f) return; setDraft(d=>({...d, buktiUrl:f.url, buktiName:f.name, buktiType:f.type})); };

  const q = search.trim().toLowerCase();
  const shown = items
    .filter(it => !q || [it.name,it.cat,it.varian,it.note].some(x=>(x||'').toLowerCase().includes(q)))
    .filter(it => fKat==='semua' || it.cat===fKat)
    .filter(it => fStatus==='semua' || (it.status||'belum')===fStatus);

  return (
    <div>
      <ModHero eyebrow="Janji Suci Seserahan" title="Mahar & Seserahan"
        desc="Kelola daftar mahar, perlengkapan ibadah, pakaian, skincare, aksesoris, hobi, harga, qty, pembayaran, dan status sudah beli."
        actions={[{label:'Tambah Item', primary:true, onClick:openNew}, {label:'Pakai Template', onClick:applyTemplate}]}
        goPage={goPage}/>

      <StatGrid items={[
        {label:'Progress Beli', value:`${pct}%`, sub:`${sudah}/${items.length} item sudah dibeli`},
        {label:'Total Rencana', value:fmt(rencana), sub:'Harga × qty'},
        {label:'Total Bayar', value:fmt(bayar), sub:'Nominal final dibayar'},
        {label:'Sisa', value:fmt(Math.max(rencana-bayar,0)), sub:'Selisih rencana dan bayar'},
      ]}/>

      <FilterBar search={search} setSearch={setSearch} placeholder="Cari item, kategori, varian…" selects={[
        {value:fKat, set:setFKat, label:'Kategori', options:[['semua','Semua kategori'], ...cats.map(c=>[c,c])]},
        {value:fStatus, set:setFStatus, label:'Status beli', options:[['semua','Semua status beli'],['belum','Belum beli'],['sudah','Sudah beli']]},
      ]}/>

      {items.length===0 ? (
        <div className="card p-8 text-center">
          <div className="text-4xl mb-3">🎁</div>
          <p className="text-sm mb-4" style={{color:'#9db09f'}}>Belum ada item. Pakai template default agar daftar awal langsung tersedia, lalu isi harga & varian.</p>
          <div className="flex justify-center gap-2 flex-wrap">
            <button onClick={applyTemplate} className="mod-btn mod-btn-primary">Pakai Template Mahar & Seserahan</button>
            <button onClick={openNew} className="mod-btn mod-btn-soft">Tambah Manual</button>
          </div>
        </div>
      ) : shown.length===0 ? (
        <EmptyMod icon="🔍" text="Tidak ada item yang cocok dengan filter."/>
      ) : (
        <div className="space-y-3">
          {shown.map(it=>{
            const done = it.status==='sudah';
            return (
              <ModItem key={it.id} accent={done?'#3fa35f':'#e3a7a0'}
                chips={<><Chip>{it.cat}</Chip><Chip tone={done?'green':'rust'}>{done?'Sudah beli':'Belum beli'}</Chip></>}
                title={it.name||'Item tanpa nama'} titleColor={done?'#23854a':null}
                note={it.note}
                actions={[
                  {label: done?'Belum Beli':'Sudah Beli', primary:!done, onClick:()=>toggle(it)},
                  {label:'Edit', onClick:()=>openEdit(it)},
                  {label:'Hapus', danger:true, onClick:()=>remove(it)},
                ]}>
                <div className="mod-mini">
                  <div><p className="mod-mini-l">Varian</p><p className="mod-mini-v">{it.varian||'—'}</p></div>
                  <div><p className="mod-mini-l">Harga</p><p className="mod-mini-v">{fmt(it.harga)}</p></div>
                  <div><p className="mod-mini-l">Qty</p><p className="mod-mini-v">{it.qty||1}</p></div>
                  <div><p className="mod-mini-l">Total</p><p className="mod-mini-v">{fmt(total(it))}</p></div>
                </div>
                <p className="text-xs mt-3" style={{color:'#7a9482'}}>Bayar: <b style={{color:'var(--sage-deep)'}}>{fmt(it.bayar)}</b></p>
                {(it.link || it.buktiUrl) && (
                  <div className="flex flex-wrap gap-2 mt-3">
                    {it.link && <a href={webUrl(it.link)} target="_blank" rel="noopener noreferrer" className="mod-btn mod-btn-sm" style={{background:'var(--gold-light)',color:'#8a6d42'}}>Buka Link Produk</a>}
                    {it.buktiUrl && <a href={it.buktiUrl} target="_blank" rel="noopener noreferrer" className="mod-btn mod-btn-soft mod-btn-sm">Bukti: {it.buktiName}</a>}
                  </div>
                )}
              </ModItem>
            );
          })}
        </div>
      )}

      <Modal open={!!draft} title={draft?.__new ? 'Tambah Item Seserahan' : 'Edit Item Seserahan'} sub="Isi kategori, nama barang, varian, link, harga, qty, bayar, dan status sudah beli."
        onClose={()=>setDraft(null)} onSave={commit} saveLabel={draft?.__new ? 'Tambah Item' : 'Simpan Perubahan'}>
        {draft && (
          <div className="mod-form">
            <Fld label="Kategori"><CatSelect value={draft.cat} onChange={v=>setD('cat',v)} options={cats}/></Fld>
            <Fld label="Nama Barang"><TextIn value={draft.name} onChange={v=>setD('name',v)} placeholder="Contoh: Tas"/></Fld>
            <Fld label="Varian"><TextIn value={draft.varian} onChange={v=>setD('varian',v)} placeholder="Warna, ukuran, model"/></Fld>
            <Fld label="Link Produk"><TextIn value={draft.link} onChange={v=>setD('link',v)} placeholder="https://shopee.co.id/…" inputMode="url"/></Fld>
            <Fld label="Harga"><RpInput value={draft.harga} onChange={v=>setD('harga',v)} placeholder="250.000"/></Fld>
            <Fld label="Qty"><TextIn value={draft.qty} onChange={v=>setD('qty',v.replace(/\D/g,''))} placeholder="1" inputMode="numeric"/></Fld>
            <Fld label="Bayar" hint="Nominal final yang benar-benar dibayar."><RpInput value={draft.bayar} onChange={v=>setD('bayar',v)} placeholder="Nominal final dibayar"/></Fld>
            <Fld label="Status Beli"><Sel value={draft.status||'belum'} onChange={v=>setD('status',v)} options={[['belum','Belum beli'],['sudah','Sudah beli']]}/></Fld>
            <Fld label="Bukti Transaksi" span2><FileField name={draft.buktiName} url={draft.buktiUrl} type={draft.buktiType} onPick={onPick} onRemove={()=>setDraft(d=>({...d,buktiUrl:null,buktiName:'',buktiType:''}))} label="Upload bukti transaksi"/></Fld>
            <Fld label="Catatan" span2><Txt value={draft.note} onChange={v=>setD('note',v)} placeholder="Catatan tambahan" rows={2}/></Fld>
          </div>
        )}
      </Modal>
    </div>
  );
}

const pinterestUrl = (query) => `https://www.pinterest.com/search/pins/?q=${encodeURIComponent(query)}`;

/* Small red "Pinterest-style" glyph — color + generic search mark, no logo reproduction */
const PinMark = ({ size=16 }) => (
  <div style={{width:size,height:size,borderRadius:'50%',background:'#E60023',color:'white',
    display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.62,fontWeight:800,
    fontFamily:'Georgia, serif',flexShrink:0}}>P</div>
);

function MoodboardPage({ data, notes, setNotes, moodTags, setMoodTags, palette, setPalette, inspirationItems, setInspirationItems, onBack, goPage }) {
  const [customTag, setCustomTag] = useState('');
  const [draft, setDraft] = useState('');
  const [newNote, setNewNote] = useState('');
  const [newLink, setNewLink] = useState('');
  const [addCat, setAddCat] = useState(INSPIRE_CATS[0]);
  const [filterCat, setFilterCat] = useState('semua');
  const [pinQuery, setPinQuery] = useState('');

  const toggleTag = (tag) => setMoodTags(prev => prev.includes(tag) ? prev.filter(t=>t!==tag) : [...prev, tag]);
  const addCustomTag = () => {
    const t = customTag.trim();
    if (!t) return;
    if (!moodTags.includes(t)) setMoodTags(prev=>[...prev, t]);
    setCustomTag('');
  };

  const addColor = (hex) => setPalette(p=>[...p, {id:Date.now(), color:hex, label:`Warna ${p.length+1}`}]);
  const updateColorLabel = (id, label) => setPalette(p=>p.map(c=>c.id===id?{...c,label}:c));
  const removeColor = (id) => setPalette(p=>p.filter(c=>c.id!==id));

  const applyTemplate = (tpl) => {
    const newSwatches = tpl.colors.map((c,i)=>({id:Date.now()+i, color:c, label:`${tpl.name} ${i+1}`}));
    setPalette(p=>[...p, ...newSwatches]);
    setMoodTags(prev => Array.from(new Set([...prev, ...tpl.tags])));
  };

  const runPinSearch = () => { if (pinQuery.trim()) window.open(pinterestUrl(pinQuery.trim()+' pernikahan'), '_blank'); };

  const addNote = () => { if(!draft.trim()) return; setNotes(n=>[...n,{id:Date.now(),text:draft.trim()}]); setDraft(''); };
  const delNote = id => setNotes(n=>n.filter(x=>x.id!==id));

  const handleImageUpload = (file) => {
    if (!file) return;
    if (!file.type.startsWith('image/')) { alert('File harus berupa gambar (JPG, PNG, dsb).'); return; }
    const blobUrl = URL.createObjectURL(file);
    setInspirationItems(items=>[...items, {id:Date.now(), cat:addCat, type:'image', src:blobUrl, note:newNote.trim(), fileName:file.name}]);
    setNewNote('');
  };

  const addLinkItem = () => {
    const url = newLink.trim();
    if (!url) return;
    setInspirationItems(items=>[...items, {id:Date.now(), cat:addCat, type:'link', src:url, note:newNote.trim(), fileName:''}]);
    setNewLink(''); setNewNote('');
  };

  const removeInspiration = (id) => {
    const item = inspirationItems.find(x=>x.id===id);
    if (item && item.type==='image' && item.src) { try { URL.revokeObjectURL(item.src); } catch(e) {} }
    setInspirationItems(items=>items.filter(x=>x.id!==id));
  };

  const hostnameOf = (url) => { try { return new URL(url).hostname.replace('www.',''); } catch(e) { return 'Link'; } };

  const filtered = filterCat==='semua' ? inspirationItems : inspirationItems.filter(x=>x.cat===filterCat);
  const catCounts = INSPIRE_CATS.reduce((acc,c)=>{ acc[c]=inspirationItems.filter(x=>x.cat===c).length; return acc; },{});

  return (
    <div>
      <ModHero eyebrow="Janji Suci Moodboard" title="Moodboard & Inspirasi" desc="Kumpulkan gaya, palet warna, dan referensi visual pernikahan kalian supaya vendor dekorasi, busana, dan MUA paham konsepnya." goPage={goPage}/>

      {/* Jelajahi Pinterest — quick search */}
      <div className="card p-5 mb-4" style={{background:'linear-gradient(135deg, var(--sage-light), var(--cream))'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}}>
          <PinMark size={34}/>
          <div>
            <h3 className="font-serif" style={{fontWeight:700,fontSize:'16px',color:'var(--sage-deep)'}}>Jelajahi Pinterest</h3>
            <p style={{fontSize:'11px',color:'#7a9482'}}>Cari lebih banyak inspirasi supaya tidak bingung mulai dari mana</p>
          </div>
        </div>
        <div className="flex gap-2">
          <input className="inp flex-1" placeholder='Contoh: "dekorasi pelaminan outdoor"' value={pinQuery}
            onChange={e=>setPinQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&runPinSearch()}/>
          <button onClick={runPinSearch} style={{padding:'0 18px',borderRadius:'14px',background:'#E60023',color:'white',
            border:'none',fontWeight:700,fontSize:'13px',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
            Cari
          </button>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginTop:'10px'}}>
          {['Dekorasi pelaminan','Gaun pengantin','Buket bunga','Undangan digital','Cake pernikahan','Seserahan','Makeup pengantin'].map(q=>(
            <button key={q} onClick={()=>window.open(pinterestUrl(q+' pernikahan'),'_blank')}
              style={{fontSize:'10px',padding:'5px 11px',borderRadius:'999px',background:'white',border:'1px solid var(--sage-mid)',color:'var(--sage-dark)',fontWeight:600,cursor:'pointer'}}>
              {q}
            </button>
          ))}
        </div>
      </div>

      {/* Referensi & Template Gaya */}
      <div className="card p-5 mb-4">
        <span className="text-[10px] font-bold tracking-widest uppercase block mb-1" style={{color:'var(--sage)'}}>Referensi &amp; Template Gaya</span>
        <p className="text-xs mb-4" style={{color:'#9db09f'}}>Belum ada gambaran? Pilih salah satu titik awal ini lalu sesuaikan</p>

          {MOOD_TEMPLATES.map(tpl=>(
            <div key={tpl.id} style={{border:'1px solid var(--sage-mist)',borderRadius:'18px',padding:'14px',display:'flex',flexDirection:'column',gap:'10px'}}>
              <div style={{display:'flex',gap:'4px'}}>
                {tpl.colors.map((c,i)=><div key={i} style={{flex:1,height:'34px',borderRadius:'8px',background:c}}/>)}
              </div>
              <div>
                <h4 className="font-serif" style={{fontWeight:700,fontSize:'14px',color:'var(--sage-deep)'}}>{tpl.name}</h4>
                <p style={{fontSize:'11px',color:'#9db09f',lineHeight:1.5,marginTop:'2px'}}>{tpl.desc}</p>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
                {tpl.tags.map(t=>(
                  <span key={t} style={{fontSize:'9px',fontWeight:700,padding:'3px 8px',borderRadius:'999px',background:'var(--sage-light)',color:'var(--sage-dark)'}}>{t}</span>
                ))}
              </div>
              <div style={{display:'flex',gap:'8px',marginTop:'2px'}}>
                <button onClick={()=>applyTemplate(tpl)}
                  style={{flex:1,padding:'9px',borderRadius:'10px',background:'var(--sage-dark)',color:'white',fontSize:'11px',fontWeight:700,border:'none',cursor:'pointer'}}>
                  ✦ Gunakan
                </button>
                <a href={pinterestUrl(tpl.q)} target="_blank" rel="noopener noreferrer"
                  style={{flex:1,padding:'9px',borderRadius:'10px',background:'#FBEAEC',color:'#E60023',fontSize:'11px',fontWeight:700,
                    textAlign:'center',textDecoration:'none',display:'flex',alignItems:'center',justifyContent:'center',gap:'5px'}}>
                  <PinMark size={13}/> Lihat
                </a>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Tema & Gaya */}
      <div className="card p-5 mb-4">
        <span className="text-[10px] font-bold tracking-widest uppercase block mb-1" style={{color:'var(--sage)'}}>Tema &amp; Gaya</span>
        <p className="text-xs mb-3" style={{color:'#9db09f'}}>Pilih gaya yang paling menggambarkan visi pernikahan kalian</p>
        <div className="flex flex-wrap gap-2 mb-3">
          {THEME_TAGS.map(tag=>{
            const active = moodTags.includes(tag);
            return (
              <button key={tag} onClick={()=>toggleTag(tag)}
                style={active?{background:'var(--sage-dark)',color:'white',border:'1px solid var(--sage-dark)'}:{background:'white',color:'#7a9482',border:'1px solid var(--sage-mid)'}}
                className="px-3 py-1.5 rounded-full text-xs font-semibold transition-all">
                {tag}
              </button>
            );
          })}
          {moodTags.filter(t=>!THEME_TAGS.includes(t)).map(tag=>(
            <button key={tag} onClick={()=>toggleTag(tag)}
              style={{background:'var(--sage-dark)',color:'white',border:'1px solid var(--sage-dark)'}}
              className="px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5">
              {tag} <span style={{opacity:.7}}>×</span>
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <input className="inp flex-1" placeholder="Tambah gaya custom…" value={customTag} onChange={e=>setCustomTag(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustomTag()}/>
          <button onClick={addCustomTag} className="w-11 h-11 rounded-xl flex items-center justify-center text-white shrink-0" style={{background:'var(--sage-dark)'}}>{Ic.plus}</button>
        </div>
      </div>

      {/* Palet Warna */}
      <div className="card p-5 mb-4">
        <span className="text-[10px] font-bold tracking-widest uppercase block mb-1" style={{color:'var(--sage)'}}>Palet Warna</span>
        <p className="text-xs mb-4" style={{color:'#9db09f'}}>Susun kombinasi warna khas pernikahan kalian</p>
        <div className="flex flex-wrap gap-4">
          {palette.map(p=>(
            <div key={p.id} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px'}}>
              <div style={{position:'relative'}}>
                <div title={p.color} style={{width:'52px',height:'52px',borderRadius:'14px',background:p.color,border:'2px solid white',boxShadow:'0 2px 10px rgba(38,58,41,.14)'}}/>
                <button onClick={()=>removeColor(p.id)}
                  style={{position:'absolute',top:'-6px',right:'-6px',width:'18px',height:'18px',borderRadius:'50%',background:'var(--rust)',color:'white',fontSize:'11px',lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center',border:'2px solid white',cursor:'pointer'}}>×</button>
              </div>
              <input value={p.label} onChange={e=>updateColorLabel(p.id,e.target.value)}
                style={{width:'64px',fontSize:'10px',textAlign:'center',border:'none',background:'transparent',color:'var(--sage-dark)',fontWeight:600,outline:'none'}}/>
            </div>
          ))}
          <label style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',cursor:'pointer'}}>
            <div style={{width:'52px',height:'52px',borderRadius:'14px',border:'2px dashed var(--sage-mid)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--sage)'}}>
              {Ic.plus}
            </div>
            <span style={{fontSize:'10px',color:'#9db09f',fontWeight:600}}>Tambah</span>
            <input type="color" defaultValue="#6B8F6E" style={{display:'none'}} onChange={e=>addColor(e.target.value)}/>
          </label>
        </div>
        {palette.length===0 && <p className="text-xs mt-3" style={{color:'#c3d1c4'}}>Klik "Tambah" untuk mulai menyusun palet warna kalian.</p>}
      </div>

      {/* Papan Inspirasi */}
      <div className="card p-5 mb-4">
        <span className="text-[10px] font-bold tracking-widest uppercase block mb-1" style={{color:'var(--sage)'}}>Papan Inspirasi</span>
        <p className="text-xs mb-4" style={{color:'#9db09f'}}>Kumpulkan foto atau link referensi per kategori</p>

        <div style={{background:'var(--sage-mist)',borderRadius:'16px',padding:'14px'}} className="mb-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-2.5">
            <div>
              <label className="lbl text-xs">Kategori</label>
              <Dropdown value={addCat} onChange={setAddCat} options={INSPIRE_CATS}/>
              <a href={pinterestUrl(PINTEREST_CAT_QUERY[addCat])} target="_blank" rel="noopener noreferrer"
                style={{display:'inline-flex',alignItems:'center',gap:'5px',marginTop:'6px',fontSize:'11px',fontWeight:600,color:'#c8232c',textDecoration:'none'}}>
                <PinMark size={12}/> Cari "{addCat}" di Pinterest
              </a>
            </div>
            <div>
              <label className="lbl text-xs">Catatan <span style={{fontWeight:400,color:'#9db09f'}}>(opsional)</span></label>
              <input className="inp" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Contoh: Dekorasi meja tamu"/>
            </div>
          </div>
          <div className="flex flex-col sm:flex-row gap-2.5">
            <label style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',padding:'11px 16px',
              background:'white',border:'1.5px dashed var(--sage-mid)',borderRadius:'14px',
              cursor:'pointer',fontSize:'13px',color:'var(--sage-dark)',fontWeight:600,flex:1}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
              Upload Gambar
              <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleImageUpload(e.target.files[0])}/>
            </label>
            <div style={{display:'flex',gap:'6px',flex:1}}>
              <input className="inp" style={{flex:1}} placeholder="atau tempel link Pinterest/Instagram…" value={newLink} onChange={e=>setNewLink(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLinkItem()}/>
              <button onClick={addLinkItem} type="button" style={{width:'46px',flexShrink:0,borderRadius:'14px',border:'1.5px solid var(--sage-mid)',background:'white',color:'var(--sage-dark)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Ic.plus}</button>
            </div>
          </div>
        </div>

        <div className="flex gap-2 mb-4 overflow-x-auto scrollbar-hide pb-1">
          <button onClick={()=>setFilterCat('semua')} className="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all"
            style={filterCat==='semua'?{background:'var(--sage-dark)',color:'white'}:{background:'white',color:'#7a9482',border:'1px solid var(--sage-mid)'}}>
            Semua ({inspirationItems.length})
          </button>
          {INSPIRE_CATS.map(c=>(
            <button key={c} onClick={()=>setFilterCat(c)} className="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all"
              style={filterCat===c?{background:'var(--sage-dark)',color:'white'}:{background:'white',color:'#7a9482',border:'1px solid var(--sage-mid)'}}>
              {c} ({catCounts[c]})
            </button>
          ))}
        </div>

        {filtered.length===0 ? (
          <div style={{textAlign:'center',padding:'32px 16px'}}>
            <div style={{fontSize:'36px',marginBottom:'8px'}}>🖼️</div>
            <p className="text-sm" style={{color:'#9db09f'}}>Belum ada inspirasi di kategori ini</p>
          </div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(140px, 1fr))',gap:'12px'}}>
            {filtered.map(item=>(
              <div key={item.id} style={{position:'relative',borderRadius:'16px',overflow:'hidden',background:'white',border:'1px solid var(--sage-mist)'}}>
                {item.type==='image' ? (
                  <img src={item.src} alt={item.note||'Inspirasi'} style={{width:'100%',height:'120px',objectFit:'cover',display:'block'}}/>
                ) : (
                  <a href={item.src} target="_blank" rel="noopener noreferrer" style={{height:'120px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'6px',background:'var(--sage-light)',textDecoration:'none',color:'var(--sage-dark)'}}>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.07 0l-2.83 2.83a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                    <span style={{fontSize:'10px',fontWeight:700,padding:'0 10px',textAlign:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'100%'}}>{hostnameOf(item.src)}</span>
                  </a>
                )}
                <div style={{padding:'8px 10px'}}>
                  <span className="badge" style={{background:'var(--sage-light)',color:'var(--sage-dark)',fontSize:'8px',padding:'2px 8px',marginBottom:'4px',display:'inline-block'}}>{item.cat}</span>
                  {item.note && <p style={{fontSize:'11px',color:'var(--sage-deep)',fontWeight:500,lineHeight:1.3}}>{item.note}</p>}
                </div>
                <button onClick={()=>removeInspiration(item.id)}
                  style={{position:'absolute',top:'6px',right:'6px',width:'24px',height:'24px',borderRadius:'50%',
                    background:'rgba(255,255,255,.92)',color:'var(--rust)',border:'none',cursor:'pointer',
                    display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 1px 4px rgba(0,0,0,.15)'}}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 6l12 12M6 18L18 6"/></svg>
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Catatan Tambahan */}
      <div className="card p-5 mb-4">
        <span className="text-[10px] font-bold tracking-widest uppercase block mb-3" style={{color:'var(--sage)'}}>Catatan Tambahan</span>
        <div className="flex gap-2 mb-4">
          <input className="inp flex-1" placeholder="Tambah ide atau catatan lain…" value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNote()}/>
          <button onClick={addNote} className="w-11 h-11 rounded-xl flex items-center justify-center text-white shrink-0" style={{background:'var(--sage-dark)'}}>{Ic.plus}</button>
        </div>
        {notes.length===0 && <p className="text-sm text-center py-4" style={{color:'#9db09f'}}>Belum ada catatan.</p>}
        <div className="space-y-2">
          {notes.map(n=>(
            <div key={n.id} className="flex items-start gap-2 px-3 py-2.5 rounded-xl" style={{background:'var(--sage-mist)'}}>
              <svg className="w-4 h-4 mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 15l4-4a2 2 0 012.5-.3l1.8 1.2a2 2 0 002.4-.2L19 8"/></svg>
              <p className="text-sm flex-1" style={{color:'var(--sage-deep)'}}>{n.text}</p>
              <button onClick={()=>delNote(n.id)} style={{color:'var(--rust)'}}>{Ic.trash}</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ REMINDER PAGE ═══════════════ */
const REM_TIPE_TONE = { Checklist:'sage', Vendor:'gold', Budget:'gold', Dokumen:'blue', Rundown:'plain', Manual:'grey' };

function ReminderPage({ checklist, setChecklist, rundown, setRundown, vendors, setVendors, budgetItems, setBudgetItems, docs, setDocs, data, dismissed, setDismissed, customReminders, setCustomReminders, onBack, goPage }) {
  const [search, setSearch] = useState('');
  const [fTipe, setFTipe] = useState('semua');
  const [fStatus, setFStatus] = useState('semua');
  const [fPic, setFPic] = useState('semua');
  const [draft, setDraft] = useState(null);

  const today = new Date(); today.setHours(0,0,0,0);
  const daysTo = iso => iso ? Math.round((new Date(iso+'T00:00:00') - today)/864e5) : null;

  /* ── Kumpulkan semua reminder dari setiap modul ── */
  const all = [];
  checklist.forEach(c=>{
    const iso = displayToIso(c.deadlineDisplay||'');
    if (!iso && ckPrio(c)!=='tinggi') return;
    all.push({ key:'c'+c.id, tipe:'Checklist', page:'checklist', title:`Checklist: ${c.title}`, date:iso||null, time:'09:00',
      desc: c.desc || (iso ? 'Reminder otomatis dari deadline checklist.' : 'Checklist prioritas tinggi tanpa deadline.'), pic:c.pic, done:c.done, urgent: ckPrio(c)==='tinggi',
      setDone: v => setChecklist(l=>l.map(x=>x.id===c.id?{...x,done:v,status:v?x.status:'proses'}:x)) });
  });
  (vendors||[]).filter(v=>v.status==='deal' && v.jatuhTempoDisplay).forEach(v=>{
    const sisa = Math.max((Number(v.harga)||0)-(Number(v.dp)||0),0);
    all.push({ key:'v'+v.id, tipe:'Vendor', page:'vendor', title:`Pelunasan vendor: ${v.name||v.cat}`, date:displayToIso(v.jatuhTempoDisplay), time:'10:00',
      desc:`Sisa pembayaran ${fmt(sisa)}${v.paket?` · ${v.paket}`:''}.`, pic:v.pic, done:v.statusBayar==='lunas', urgent:true,
      setDone: val => setVendors(l=>l.map(x=>x.id===v.id?{...x,statusBayar: val?'lunas':(Number(x.dp)>0?'dp':'belum_dp')}:x)) });
  });
  (budgetItems||[]).filter(b=>!b.source && b.deadlineLunas).forEach(b=>{
    all.push({ key:'b'+b.id, tipe:'Budget', page:'budget', title:`Pelunasan: ${b.label}`, date:displayToIso(b.deadlineLunas), time:'10:00',
      desc:`Sisa bayar ${fmt(bSisa(b))} · ${b.cat}.`, pic:'', done:bStatus(b)==='lunas', urgent:true,
      setDone: val => setBudgetItems(l=>l.map(x=>x.id===b.id?{...x,statusBayar: val?'lunas':(Number(x.dp)>0?'dp':'belum')}:x)) });
  });
  (docs||[]).filter(d=>d.deadlineDisplay).forEach(d=>{
    all.push({ key:'d'+d.id, tipe:'Dokumen', page:'dokumen', title:`Dokumen: ${d.name}`, date:displayToIso(d.deadlineDisplay), time:'09:00',
      desc: d.note || `Kategori ${d.cat}.`, pic:d.pic, done:d.done, urgent:d.cat==='KUA/Catatan Sipil',
      setDone: val => setDocs(l=>l.map(x=>x.id===d.id?{...x,done:val}:x)) });
  });
  rundown.forEach((r,i)=>{
    all.push({ key:'r'+i, tipe:'Rundown', page:'rundown', title:`Rundown: ${r.title}`, date:rundownDate(r, data)||null, time:r.time||'08:00',
      desc: [r.lokasi && `Lokasi: ${r.lokasi}`, r.note].filter(Boolean).join(' · ') || 'Agenda hari H.', pic:r.pic, done:(r.status||'belum')==='selesai', urgent:false,
      setDone: val => setRundown(l=>l.map((x,idx)=>idx===i?{...x,status: val?'selesai':'belum'}:x)) });
  });
  customReminders.forEach(m=>{
    all.push({ key:'m'+m.id, tipe:'Manual', page:null, manual:m, title:m.title, date:m.date||null, time:m.time||'09:00',
      desc:m.note, pic:m.pic, done:!!m.done, urgent:!!m.urgent,
      setDone: val => setCustomReminders(l=>l.map(x=>x.id===m.id?{...x,done:val}:x)) });
  });
  all.forEach(r=>{
    r.status = dismissed.includes(r.key) ? 'batal' : r.done ? 'selesai' : 'aktif';
    r.days = daysTo(r.date);
    r.lewat = r.status==='aktif' && r.days!==null && r.days<0;
    r.h7 = r.status==='aktif' && r.days!==null && r.days>=0 && r.days<=7;
  });

  const aktif = all.filter(r=>r.status==='aktif');
  const lewat = aktif.filter(r=>r.lewat);
  const h7 = aktif.filter(r=>r.h7);
  const selesai = all.filter(r=>r.status==='selesai').length;
  const batal = all.filter(r=>r.status==='batal').length;
  const upcoming = aktif.filter(r=>r.days!==null && r.days>=0).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const nearest = upcoming[0] || [...lewat].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0] || null;
  const pics = uniqOpts(all.map(r=>r.pic));

  const calHref = r => gcalLink(`[Janji Suci] ${r.title}`, r.date ? combineDateTime(r.date, r.time) : null, `Reminder dari Janji Suci\n\nTipe: ${r.tipe}\nPIC: ${r.pic||'-'}\nCatatan: ${r.desc||'-'}`);
  const setDone = (r, v) => { r.setDone(v); toast(v ? 'Reminder selesai' : 'Reminder aktif lagi', r.title); };
  const toggleBatal = r => {
    if (r.status==='batal') { setDismissed(d=>d.filter(x=>x!==r.key)); toast('Reminder diaktifkan lagi', r.title); }
    else { setDismissed(d=>[...d, r.key]); toast('Reminder dibatalkan', `${r.title} — bisa diaktifkan lagi kapan saja.`); }
  };
  const removeManual = r => { if (!confirmHapus('reminder', r.title)) return; setCustomReminders(l=>l.filter(x=>x.id!==r.manual.id)); toast('Reminder dihapus', 'Daftar reminder sudah diperbarui.'); };

  const openNew = () => setDraft({ __new:true, id:Date.now(), title:'', dateDisp:'', time:'09:00', pic:'', urgent:false, note:'' });
  const openEdit = m => setDraft({ ...m, dateDisp: m.date ? isoToDisplay(m.date) : '', time: m.time||'09:00' });
  const setD = (k,v) => setDraft(d=>({...d,[k]:v}));
  const commit = () => {
    if (!draft.title.trim()) { alert('Judul reminder wajib diisi.'); return; }
    const { __new, dateDisp, ...d } = draft;
    const item = { ...d, title:d.title.trim(), date: dateDisp ? displayToIso(dateDisp) : null, done: !!d.done };
    if (__new) setCustomReminders(l=>[...l, item]); else setCustomReminders(l=>l.map(x=>x.id===item.id?item:x));
    setDraft(null); toast(__new ? 'Reminder ditambahkan' : 'Reminder tersimpan');
  };

  const q = search.trim().toLowerCase();
  const order = { aktif:0, selesai:1, batal:2 };
  const shown = all
    .filter(r => !q || [r.title,r.desc,r.pic].some(x=>(x||'').toLowerCase().includes(q)))
    .filter(r => fTipe==='semua' || r.tipe===fTipe)
    .filter(r => fStatus==='semua' || (fStatus==='lewat' ? r.lewat : fStatus==='h7' ? r.h7 : r.status===fStatus))
    .filter(r => fPic==='semua' || r.pic===fPic)
    .sort((a,b)=> order[a.status]-order[b.status] || ((a.date||'9999')+a.time).localeCompare((b.date||'9999')+b.time));

  const whenLabel = r => r.days===null ? 'Tanpa tanggal' : r.days<0 ? `Lewat ${-r.days} hari` : r.days===0 ? 'Hari ini' : `${r.days} hari lagi`;

  return (
    <div>
      <ModHero eyebrow="Janji Suci Reminder" title="Reminder Persiapan"
        desc="Kelola pengingat penting dari checklist, vendor, budget, dokumen, rundown, dan kebutuhan khusus menjelang hari H."
        actions={[{label:'Tambah Reminder', primary:true, onClick:openNew}]} goPage={goPage}/>

      <div className="card p-5 lg:p-7 mb-4">
        <p className="text-[11px] font-bold mb-1" style={{color:'var(--sage-dark)'}}>Reminder Terdekat</p>
        {nearest ? (
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div style={{flex:'1 1 320px'}} className="min-w-0">
              <h3 className="mod-title text-2xl lg:text-[28px] mb-1">{nearest.title}</h3>
              <p className="text-xs mb-2" style={{color:'#7a9482'}}>{nearest.date ? fmtDate(nearest.date+'T00:00:00') : 'Tanpa tanggal'} • {nearest.time} · <b style={{color: nearest.lewat?'var(--rust)':'var(--gold)'}}>{whenLabel(nearest)}</b></p>
              {nearest.desc && <p className="text-[13px]" style={{color:'#6f8873'}}>{nearest.desc}</p>}
            </div>
            <a href={calHref(nearest)} target="_blank" rel="noopener noreferrer" className="mod-btn mod-btn-primary">Tambah ke Google Calendar</a>
          </div>
        ) : <p className="text-sm" style={{color:'#9db09f'}}>Belum ada reminder aktif bertanggal. Isi deadline di Checklist, Vendor, Budget, atau Dokumen — reminder dibuat otomatis.</p>}
      </div>

      <StatGrid items={[
        {label:'Aktif', value:aktif.length, sub:'Reminder berjalan'},
        {label:'Urgent H-7', value:h7.length, sub:'Perlu perhatian', color: h7.length?'#8a6d42':null},
        {label:'Lewat', value:lewat.length, sub:'Belum selesai', color: lewat.length?'var(--rust)':null},
        {label:'Selesai / Batal', value:`${selesai}/${batal}`, sub:'Riwayat reminder'},
      ]}/>

      <FilterBar search={search} setSearch={setSearch} placeholder="Cari reminder, PIC, catatan…" selects={[
        {value:fTipe, set:setFTipe, label:'Tipe', options:[['semua','Semua tipe'], ...['Checklist','Vendor','Budget','Dokumen','Rundown','Manual'].map(t=>[t,t])]},
        {value:fStatus, set:setFStatus, label:'Status', options:[['semua','Semua status'],['aktif','Aktif'],['h7','Urgent H-7'],['lewat','Lewat'],['selesai','Selesai'],['batal','Batal']]},
        {value:fPic, set:setFPic, label:'PIC', options:[['semua','Semua PIC'], ...pics.map(p=>[p,p])]},
      ]}/>

      {all.length===0 ? (
        <EmptyMod icon="🔔" text="Belum ada reminder. Reminder otomatis muncul dari deadline checklist, pelunasan vendor & budget, dokumen, dan rundown." action={{label:'Tambah Reminder', onClick:openNew}}/>
      ) : shown.length===0 ? (
        <EmptyMod icon="🔍" text="Tidak ada reminder yang cocok dengan filter."/>
      ) : (
        <div className="space-y-3">
          {shown.map(r=>(
            <ModItem key={r.key} accent={r.status==='selesai'?'#3fa35f':r.status==='batal'?'#cfd5cf':r.lewat?'var(--rust)':r.h7?'var(--gold)':'var(--sage-mid)'}
              chips={<>
                <Chip tone={REM_TIPE_TONE[r.tipe]}>{r.tipe}</Chip>
                <Chip tone={r.status==='selesai'?'green':r.status==='batal'?'grey':'blue'}>{r.status==='aktif'?'Aktif':r.status==='selesai'?'Selesai':'Batal'}</Chip>
                {r.status==='aktif' && r.days!==null && <Chip tone={r.lewat?'rust':r.h7?'gold':'plain'}>{whenLabel(r)}</Chip>}
                {r.urgent && r.status==='aktif' && <Chip tone="rust">prioritas</Chip>}
              </>}
              title={r.title} titleColor={r.status==='selesai'?'#23854a':r.status==='batal'?'#9db09f':null}
              meta={[r.date ? dispShort(isoToDisplay(r.date)) : 'Tanpa tanggal', r.time, r.pic && `PIC: ${r.pic}`]}
              desc={r.desc}
              actions={[
                {label:'Tambah ke Google Calendar', primary:true, href:calHref(r)},
                r.status==='batal' ? null : r.status==='selesai' ? {label:'Aktifkan Lagi', onClick:()=>setDone(r,false)} : {label:'Tandai Selesai', onClick:()=>setDone(r,true)},
                {label: r.status==='batal'?'Aktifkan':'Batalkan', onClick:()=>toggleBatal(r)},
                r.manual ? {label:'Edit', onClick:()=>openEdit(r.manual)} : {label:`Buka ${r.tipe}`, onClick:()=>goPage(r.page)},
                r.manual && {label:'Hapus', danger:true, onClick:()=>removeManual(r)},
              ]}/>
          ))}
        </div>
      )}

      <Modal open={!!draft} title={draft?.__new ? 'Tambah Reminder' : 'Edit Reminder'} sub="Reminder manual untuk kebutuhan khusus di luar modul lain."
        onClose={()=>setDraft(null)} onSave={commit} saveLabel={draft?.__new ? 'Tambah Reminder' : 'Simpan Perubahan'}>
        {draft && (
          <div className="mod-form">
            <Fld label="Judul Reminder" span2><TextIn value={draft.title} onChange={v=>setD('title',v)} placeholder="Contoh: Follow up MUA soal jadwal trial"/></Fld>
            <Fld label="Tanggal"><DateField value={draft.dateDisp} onChange={v=>setD('dateDisp',v)}/></Fld>
            <Fld label="Jam"><TimePicker value={draft.time} onChange={v=>setD('time',v)} placeholder="09:00"/></Fld>
            <Fld label="PIC"><TextIn value={draft.pic} onChange={v=>setD('pic',v)} placeholder="Penanggung jawab"/></Fld>
            <Fld label="Prioritas"><Sel value={draft.urgent?'tinggi':'biasa'} onChange={v=>setD('urgent',v==='tinggi')} options={[['biasa','Biasa'],['tinggi','Tinggi']]}/></Fld>
            <Fld label="Catatan" span2><Txt value={draft.note} onChange={v=>setD('note',v)} placeholder="Detail yang perlu diingat"/></Fld>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ═══════════════ MAIN APP ═══════════════ */
function App() {
  const [screen, setScreen] = useState('register'); // register | login | dashEmpty | setup | loading | app
  const [page, setPage] = useState('dashboard');
  const [lastMobilePrimary, setLastMobilePrimary] = useState('dashboard');
  const [user, setUser] = useState(null);
  const [project, setProject] = useState(null);
  const [loadStep, setLoadStep] = useState(0);

  const [checklist, setChecklist] = useState([]);
  const [checkLoading, setCheckLoading] = useState(false);
  const [rundown, setRundown] = useState([]);
  const [runLoading, setRunLoading] = useState(false);
  const [guests, setGuests] = useState([]);
  const [undanganLink, setUndanganLink] = useState('');
  const [vendors, setVendors] = useState([]);
  const [docs, setDocs] = useState(DOC_DEFAULT);
  const [seserahan, setSeserahan] = useState([]);
  const [moodNotes, setMoodNotes] = useState([]);
  const [moodTags, setMoodTags] = useState([]);
  const [palette, setPalette] = useState([]);
  const [inspirationItems, setInspirationItems] = useState([]);
  const [budgetItems, setBudgetItems] = useState(() => seedBudgetItems());
  const [dismissedReminders, setDismissedReminders] = useState([]);
  const [customReminders, setCustomReminders] = useState([]);
  const [pageLoading, setPageLoading] = useState(false);
  const [sbCollapsed, setSbCollapsed] = useState(() => { try { return localStorage.getItem('js-sidebar')==='1'; } catch(e) { return false; } });
  const toggleSidebar = () => setSbCollapsed(c => { const n = !c; try { localStorage.setItem('js-sidebar', n?'1':'0'); } catch(e) {} return n; });
  const loadTimer = useRef(null);

  /* Budget otomatis dari Vendor (deal) & Mahar/Seserahan */
  useEffect(() => {
    setBudgetItems(items => {
      const manual = items.filter(i=>!i.source && !i.vendorId);
      const prev = items.filter(i=>i.source || i.vendorId);
      const synced = syncedBudgetItems(vendors, seserahan);
      if (JSON.stringify(prev)===JSON.stringify(synced)) return items;
      return [...manual, ...synced];
    });
  }, [vendors, seserahan]);

  const handleLogin = (u) => { setUser(u); setScreen('dashEmpty'); };
  const handleLogout = () => { setUser(null); setScreen('register'); setPage('dashboard'); };

  const onUpdateBudget = (newAmount) => {
    setProject(p => ({ ...p, budget: newAmount }));
  };
  const onUpdateCurrency = (cur) => setProject(p => ({ ...p, currency: cur }));
  APP_CUR = (project && project.currency) || 'IDR';

  const generateChecklist = async (data) => {
    setCheckLoading(true);
    const computeDeadline = (daysBefore) => {
      if (!data.tanggal || daysBefore==null) return '';
      const d = new Date(data.tanggal);
      d.setDate(d.getDate() - Number(daysBefore));
      return isoToDisplay(d.toISOString().slice(0,10));
    };
    try {
      const raw = await callAI(
        `Buatkan checklist persiapan pernikahan untuk ${data.namaW} dan ${data.namaP}, tema "${data.tema||'elegan'}", budget Rp ${Number(data.budget).toLocaleString('id-ID')}, jadwal: ${data.tanggal ? jadwalText(data) : 'belum ditentukan'}${isBedaHari(data)?' (akad & resepsi beda hari — sertakan persiapan untuk kedua acara)':''}.
Kembalikan HANYA JSON array tanpa markdown:
[{"id":1,"category":"KATEGORI","title":"Judul item","urgent":true,"done":false,"daysBefore":90,"pic":"Mempelai Wanita"}]
Buat 20-25 item, kategori: Dokumen, Venue & Dekorasi, Katering, Busana, Dokumentasi, Undangan, Lainnya. urgent:true untuk 5-7 terpenting.
"daysBefore" = berapa hari sebelum hari-H item ini idealnya selesai (realistis, makin penting/besar tugasnya makin jauh dari hari-H, contoh: booking venue 90-120, fitting gaun 30-45, cetak undangan 20-30, konfirmasi vendor 3-7).
"pic" = penanggung jawab realistis (contoh: "Mempelai Wanita", "Mempelai Pria", "Kedua Mempelai", "Orang Tua", "WO").`,
        'Kamu asisten wedding planner Indonesia. Kembalikan HANYA valid JSON array, tanpa teks lain.'
      );
      const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
      setChecklist(parsed.map(it=>({
        ...it, deadlineDisplay: computeDeadline(it.daysBefore), note:'',
      })));
    } catch {
      setChecklist([
        {id:1,category:'Dokumen',title:'Urus surat nikah di KUA',urgent:true,done:false,deadlineDisplay:computeDeadline(60),pic:'Kedua Mempelai',note:''},
        {id:2,category:'Dokumen',title:'Persiapkan akta lahir & KTP',urgent:true,done:false,deadlineDisplay:computeDeadline(60),pic:'Kedua Mempelai',note:''},
        {id:3,category:'Venue & Dekorasi',title:'Booking venue & DP',urgent:true,done:false,deadlineDisplay:computeDeadline(100),pic:'Mempelai Pria',note:''},
        {id:4,category:'Venue & Dekorasi',title:'Diskusi tema dekorasi',urgent:false,done:false,deadlineDisplay:computeDeadline(45),pic:'Mempelai Wanita',note:''},
        {id:5,category:'Katering',title:'Survey & pilih katering',urgent:true,done:false,deadlineDisplay:computeDeadline(75),pic:'WO',note:''},
        {id:6,category:'Busana',title:'Pilih & fitting gaun pengantin',urgent:false,done:false,deadlineDisplay:computeDeadline(35),pic:'Mempelai Wanita',note:''},
        {id:7,category:'Dokumentasi',title:'Booking fotografer',urgent:true,done:false,deadlineDisplay:computeDeadline(80),pic:'Kedua Mempelai',note:''},
        {id:8,category:'Undangan',title:'Desain undangan pernikahan',urgent:false,done:false,deadlineDisplay:computeDeadline(25),pic:'Mempelai Wanita',note:''},
      ]);
    }
    setCheckLoading(false);
  };

  const shiftTime = (t, mins) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(t||''); if (!m) return t;
    const tot = Math.min(23*60+59, Math.max(0, (+m[1])*60 + (+m[2]) + mins));
    return `${String(Math.floor(tot/60)).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
  };

  const generateRundown = async (data) => {
    setRunLoading(true);
    const beda = isBedaHari(data);
    const [evA, evR] = weddingEvents(data);
    const jamA = data.jamAkad || '08:00', jamR = data.jamResepsi || '11:00';
    const lokA = evA.venue || 'lokasi akad', lokR = evR.venue || 'venue resepsi';
    const lokasiInfo = data.venueAkadSama===false && data.venueAkad
      ? `Akad di ${data.venueAkad}, resepsi di ${data.namaVenue||'venue resepsi'} (lokasi berbeda, sisipkan perjalanan antar lokasi).`
      : `Akad & resepsi di ${data.namaVenue||'venue pernikahan'}.`;
    try {
      const prompt = beda
        ? `Buatkan rundown pernikahan ${data.namaW} & ${data.namaP}. Akad dan resepsi di HARI BERBEDA:
- Hari akad: ${fmtDate(evA.date)}, akad jam ${jamA}, lokasi ${lokA}.
- Hari resepsi: ${fmtDate(evR.date)}, resepsi jam ${jamR}, lokasi ${lokR}.
Kembalikan HANYA JSON array tanpa markdown:
[{"hari":"akad","time":"HH:MM","title":"Nama agenda","lokasi":"Area/ruangan","pic":"Penanggung jawab","note":"Catatan singkat"}]
"hari" wajib "akad" atau "resepsi". Buat 5-7 item untuk hari akad (rias, tiba di lokasi, akad, sungkeman, foto keluarga, ramah tamah) dan 8-10 item untuk hari resepsi (rias, briefing vendor, prosesi masuk, resepsi, makan & hiburan, penutupan). Urutkan per hari berdasarkan jam. Isi lokasi & pic realistis (MUA, WO, Keluarga, Fotografer, MC).`
        : `Buatkan rundown hari-H pernikahan ${data.namaW} & ${data.namaP}. ${lokasiInfo} Akad: ${jamA}, resepsi: ${jamR}.
Kembalikan HANYA JSON array tanpa markdown:
[{"time":"HH:MM","title":"Nama agenda","lokasi":"Area/ruangan di venue","pic":"Penanggung jawab/vendor terkait","note":"Catatan singkat"}]
Buat 10-14 item dari persiapan pagi hingga penutupan resepsi. Isi lokasi dengan area realistis (contoh: Ruang Rias, Area Akad, Ballroom Utama, Panggung Pelaminan). Isi pic dengan pihak realistis (contoh: MUA, WO, Keluarga, Fotografer, MC).`;
      const raw = await callAI(prompt, 'Kamu wedding coordinator Indonesia. Kembalikan HANYA valid JSON array.');
      const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
      setRundown(parsed.map(it=>{
        const { hari, ...rest } = it;
        return beda ? { ...rest, hari: hari==='resepsi' ? 'resepsi' : 'akad' } : rest;
      }));
    } catch {
      if (beda) {
        setRundown([
          {hari:'akad', time:shiftTime(jamA,-150), title:'Rias & persiapan mempelai', lokasi:'Ruang Rias', pic:'MUA & Keluarga', note:'Makeup & busana akad'},
          {hari:'akad', time:shiftTime(jamA,-30), title:`Tiba di ${lokA} & briefing`, lokasi:lokA, pic:'WO & Keluarga', note:'Cek mahar, cincin, dan berkas KUA'},
          {hari:'akad', time:jamA, title:'Akad Nikah', lokasi:lokA, pic:'Penghulu & Wali', note:'Prosesi ijab kabul'},
          {hari:'akad', time:shiftTime(jamA,60), title:'Sungkeman & foto keluarga', lokasi:lokA, pic:'Fotografer', note:'Foto bersama keluarga inti'},
          {hari:'akad', time:shiftTime(jamA,120), title:'Ramah tamah keluarga', lokasi:lokA, pic:'Keluarga', note:'Makan bersama keluarga'},
          {hari:'resepsi', time:shiftTime(jamR,-180), title:'Rias & persiapan mempelai', lokasi:'Ruang Rias', pic:'MUA', note:'Makeup & busana resepsi'},
          {hari:'resepsi', time:shiftTime(jamR,-45), title:'Tiba di venue & briefing vendor', lokasi:lokR, pic:'WO', note:'Koordinasi WO, MC, katering, dokumentasi'},
          {hari:'resepsi', time:jamR, title:'Prosesi masuk & resepsi dimulai', lokasi:lokR, pic:'MC & WO', note:'Pintu tamu dibuka'},
          {hari:'resepsi', time:shiftTime(jamR,60), title:'Makan & hiburan', lokasi:lokR, pic:'Katering & Entertainment', note:'Katering tersedia'},
          {hari:'resepsi', time:shiftTime(jamR,180), title:'Penutupan resepsi', lokasi:lokR, pic:'MC', note:'Terima kasih kepada tamu undangan'},
        ]);
      } else {
        setRundown([
          {time:shiftTime(jamA,-120),title:'Persiapan pagi pengantin',lokasi:'Ruang Rias',pic:'MUA & Keluarga',note:'Makeup & hair do mempelai wanita'},
          {time:shiftTime(jamA,-30),title:'Tiba di venue & briefing',lokasi:evA.venue||'Lobby Utama',pic:'WO',note:'Koordinasi tim WO dan vendor'},
          {time:jamA,title:'Akad Nikah',lokasi:evA.venue||'Area Akad',pic:'Penghulu & Keluarga',note:'Prosesi ijab kabul'},
          {time:shiftTime(jamA,60),title:'Foto keluarga & dokumentasi',lokasi:'Panggung Pelaminan',pic:'Fotografer',note:'Foto bersama keluarga inti'},
          {time:jamR,title:'Resepsi dimulai',lokasi:evR.venue||'Ballroom Utama',pic:'MC & WO',note:'Pintu tamu dibuka'},
          {time:shiftTime(jamR,60),title:'Makan siang & hiburan',lokasi:evR.venue||'Ballroom Utama',pic:'Katering',note:'Katering tersedia'},
          {time:shiftTime(jamR,210),title:'Penutupan resepsi',lokasi:evR.venue||'Ballroom Utama',pic:'MC',note:'Terimakasih kepada tamu undangan'},
        ]);
      }
    }
    setRunLoading(false);
  };

  /* Saat jadwal diubah ke "beda hari" setelah rundown ada: bagi agenda lama ke hari akad / resepsi */
  const guessRundownDay = (it, data) => {
    const t = (it.title||'') + ' ' + (it.note||'');
    if (/akad|ijab|kabul|pemberkatan|penghulu|sungkem|siraman|midodareni|mahar|wali/i.test(t)) return 'akad';
    if (/resepsi|tamu|pelaminan|kirab|hiburan|katering|makan|penutupan|salam/i.test(t)) return 'resepsi';
    const toM = x => { const m = /^(\d{1,2}):(\d{2})$/.exec(x||''); return m ? (+m[1])*60 + (+m[2]) : null; };
    const ti = toM(it.time), tr = toM(data.jamResepsi);
    return ti!==null && tr!==null && ti >= tr - 60 ? 'resepsi' : 'akad';
  };

  const handleSaveSetup = async (data) => {
    const isFirst = !project;
    setProject(data);
    setScreen('loading');
    setLoadStep(0);
    for (let i=0;i<4;i++) { await new Promise(r=>setTimeout(r,600)); setLoadStep(i); }
    if (isFirst) {
      await Promise.all([generateChecklist(data), generateRundown(data)]);
      setBudgetItems(seedBudgetItems(data.budget));
    } else if (isBedaHari(data)) {
      setRundown(list => list.map(it => it.hari ? it : { ...it, hari: guessRundownDay(it, data) }));
    }
    setScreen('app'); setPage('dashboard');
  };

  const goPage = (p) => {
    if (['dashboard','checklist','budget','tamu'].includes(p)) setLastMobilePrimary(p);
    if (p !== page) {
      setPageLoading(true);
      clearTimeout(loadTimer.current);
      loadTimer.current = setTimeout(()=>setPageLoading(false), 420);
    }
    setPage(p);
  };

  const pageProps = { onBack: () => goPage('more') };

  const renderPage = () => {
    switch(page) {
      case 'dashboard': return <DashboardPage data={project} checklist={checklist} rundown={rundown} guests={guests} vendors={vendors} docs={docs} seserahan={seserahan} budgetItems={budgetItems} customReminders={customReminders} dismissedReminders={dismissedReminders} inspirationItems={inspirationItems} onSetup={()=>setScreen('setup')} goPage={goPage}/>;
      case 'panduan': return <PanduanPage onBack={pageProps.onBack} goPage={goPage} checklist={checklist} budgetItems={budgetItems} vendors={vendors} guests={guests} rundown={rundown} docs={docs} seserahan={seserahan} undanganLink={undanganLink}/>;
      case 'checklist': return <ChecklistPage list={checklist} setList={setChecklist} loading={checkLoading} data={project} goPage={goPage}/>;
      case 'budget': return <BudgetPage budget={project.budget} budgetItems={budgetItems} setBudgetItems={setBudgetItems} vendors={vendors} setVendors={setVendors} data={project} onUpdateBudget={onUpdateBudget} onUpdateCurrency={onUpdateCurrency} goPage={goPage}/>;
      case 'vendor': return <VendorPage vendors={vendors} setVendors={setVendors} onBack={pageProps.onBack} goPage={goPage} data={project}/>;
      case 'tamu': return <GuestPage guests={guests} setGuests={setGuests} data={project} undanganLink={undanganLink} setUndanganLink={setUndanganLink} goPage={goPage}/>;
      case 'rundown': return <RundownPage rundown={rundown} setRundown={setRundown} loading={runLoading} data={project} onBack={pageProps.onBack} goPage={goPage}/>;
      case 'seserahan': return <SeserahanPage items={seserahan} setItems={setSeserahan} onBack={pageProps.onBack} goPage={goPage}/>;
      case 'dokumen': return <DocumentsPage docs={docs} setDocs={setDocs} onBack={pageProps.onBack} goPage={goPage} data={project}/>;
      case 'reminder': return <ReminderPage checklist={checklist} setChecklist={setChecklist} rundown={rundown} setRundown={setRundown} vendors={vendors} setVendors={setVendors} budgetItems={budgetItems} setBudgetItems={setBudgetItems} docs={docs} setDocs={setDocs} data={project} dismissed={dismissedReminders} setDismissed={setDismissedReminders} customReminders={customReminders} setCustomReminders={setCustomReminders} onBack={pageProps.onBack} goPage={goPage}/>;
      case 'moodboard': return <MoodboardPage data={project} notes={moodNotes} setNotes={setMoodNotes} moodTags={moodTags} setMoodTags={setMoodTags} palette={palette} setPalette={setPalette} inspirationItems={inspirationItems} setInspirationItems={setInspirationItems} onBack={pageProps.onBack} goPage={goPage}/>;
      case 'profil': return <ProfilePage user={user} onBack={pageProps.onBack} onEditSetup={()=>setScreen('setup')} onLogout={handleLogout}/>;
      case 'more': return <MorePage goPage={goPage} onSetup={()=>setScreen('setup')} onLogout={handleLogout}/>;
      default: return null;
    }
  };

  if (screen==='register') return <RegisterScreen onLogin={handleLogin} onGoLogin={()=>setScreen('login')}/>;
  if (screen==='login') return <LoginScreen onLogin={handleLogin} onGoRegister={()=>setScreen('register')}/>;
  if (screen==='dashEmpty') return <DashboardEmptyScreen user={user} onSetup={()=>setScreen('setup')} onLogout={handleLogout}/>;
  if (screen==='setup') return <SetupScreen initial={project} onSave={handleSaveSetup} onBack={()=>setScreen(project?'app':'dashEmpty')}/>;
  if (screen==='loading') return <LoadingScreen step={loadStep}/>;

  return (
    <div className="flex h-full w-full absolute inset-0">
      <Sidebar page={page} goPage={goPage} user={user} onLogout={handleLogout} collapsed={sbCollapsed} onToggle={toggleSidebar}/>
      <div className="flex-1 flex flex-col min-w-0" style={{background:'var(--sage-mist)'}}>
        <main className="flex-1 overflow-y-auto custom-scroll px-4 pt-4 lg:pt-8 lg:px-10 pb-28 lg:pb-10 anim-fadein" key={page}>
          {pageLoading ? <PageLoader page={page}/> : renderPage()}
        </main>
        <BottomNav active={page} goPage={goPage}/>
      </div>
    </div>
  );
}

/* Layar transisi singkat saat pindah menu */
const PAGE_TIPS = {
  dashboard:['dashboard','Semua ringkasan persiapan ada di satu layar.'],
  panduan:['panduan','Ikuti urutan langkah agar data saling tersambung.'],
  checklist:['checklist','Gunakan checklist untuk memecah persiapan besar menjadi langkah kecil yang lebih mudah dikerjakan.'],
  budget:['budget','Catat estimasi, DP, pelunasan, dan realisasi agar tidak ada biaya penting yang terlewat.'],
  vendor:['vendor','Simpan kontak, paket, dan status pembayaran semua vendor di satu tempat.'],
  tamu:['daftar tamu','Simpan link undangan digital supaya pesan WhatsApp langsung rapi.'],
  rundown:['rundown','Gunakan Mode Hari H untuk memantau acara yang sedang berjalan.'],
  seserahan:['seserahan','Catat harga, qty, link produk, nominal bayar, dan status beli agar seserahan lebih rapi.'],
  dokumen:['dokumen','Template Administrasi KUA membantu kamu mulai lebih cepat.'],
  reminder:['reminder','Reminder bisa ditambahkan ke Google Calendar agar lebih mudah dipantau.'],
  moodboard:['moodboard','Kumpulkan inspirasi supaya vendor dekorasi paham konsep kalian.'],
  profil:['profil',''], more:['menu',''],
};
function PageLoader({ page }) {
  const [label, tip] = PAGE_TIPS[page] || ['halaman',''];
  return (
    <div className="page-loader anim-fadein">
      <div className="ring mb-5"/>
      <p className="text-[11px] font-bold tracking-[.24em] uppercase mb-2" style={{color:'var(--sage-dark)'}}>Janji Suci</p>
      <p className="mod-title text-xl mb-1">Memuat {label}…</p>
      <p className="text-xs" style={{color:'#9db09f'}}>Mohon tunggu sebentar.</p>
      {tip && <p className="text-xs mt-6 max-w-xs" style={{color:'var(--sage-dark)',lineHeight:1.7}}>{tip}</p>}
    </div>
  );
}

function Root() {
  return (
    <div className="w-full h-screen relative overflow-hidden" style={{background:'var(--cream)'}}>
      <App/>
      <ToastHost/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
