            <div>
              <p className="text-xs mb-1" style={{color:'#9db09f'}}>Vendor Deal</p>
              <p className="font-serif text-2xl lg:text-3xl font-bold" style={{color:'var(--sage-deep)'}}>{dealVendors.length}/{vendorList.length}</p>
            </div>
            <div>
              <p className="text-xs mb-1" style={{color:'#9db09f'}}>Belum Lunas</p>
              <p className="font-serif text-2xl lg:text-3xl font-bold" style={{color:belumLunas.length?'var(--rust)':'var(--sage-deep)'}}>{belumLunas.length}</p>
            </div>
          </div>
          {sisaBayar>0 && <p className="text-xs mt-3 pt-3" style={{color:'#7a9482',borderTop:'1px solid var(--sage-mist)'}}>Sisa pelunasan: <b style={{color:'var(--rust)'}}>{fmt(sisaBayar)}</b></p>}
        </div>
      </div>

      {/* ── SEMUA MODUL ── */}
      <div className="card p-5 lg:p-7">
        <div className="flex flex-wrap items-start justify-between gap-3 mb-5">
          <div>
            <h3 className="font-serif italic text-xl lg:text-2xl" style={{color:'var(--sage-deep)'}}>Semua Modul</h3>
            <p className="text-xs mt-0.5" style={{color:'#9db09f'}}>Akses cepat ke semua fitur Janji Suci.</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={exportXLSX} disabled={exporting} className="text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 whitespace-nowrap"
              style={{background:'white',color:'var(--sage-dark)',border:'1.5px solid var(--sage-mid)',cursor:'pointer'}}>
              <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
              {exporting?'Menyiapkan…':'Export XLSX'}
            </button>
            <button onClick={()=>goPage('more')} className="lg:hidden text-xs font-bold px-3 py-2 rounded-xl whitespace-nowrap"
              style={{background:'var(--sage-light)',color:'var(--sage-dark)',border:'none',cursor:'pointer'}}>Menu Lainnya</button>
          </div>
        </div>

        <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 lg:gap-4">
          {modules.map((m,mi)=>(
            <button key={m.id} onClick={()=>goPage(m.id)} className={`text-left rounded-2xl p-3.5 lg:p-5 flex flex-col transition-all ${modules.length%2===1 && mi===modules.length-1 ? 'col-span-2 lg:col-span-1' : ''}`}
              style={{background:'white',border:'1px solid var(--sage-light)',cursor:'pointer'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--sage-mid)';e.currentTarget.style.boxShadow='0 6px 20px rgba(38,58,41,.08)';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--sage-light)';e.currentTarget.style.boxShadow='none';}}>
              <div className="flex items-start justify-between gap-2 mb-2">
                <div className="w-8 h-8 lg:w-9 lg:h-9 rounded-xl flex items-center justify-center shrink-0" style={{background:'var(--sage-mist)',color:'var(--sage-dark)'}}>{m.icon}</div>
                <span className="text-[10px] lg:text-[11px] font-bold px-2 py-0.5 rounded-full truncate max-w-[60%]" style={{background:'var(--sage-mist)',color:'var(--sage-dark)'}}>{m.badge}</span>
              </div>
              <p className="font-serif font-bold text-[15px] lg:text-lg leading-tight mb-1" style={{color:'var(--sage-deep)'}}>{m.label}</p>
              <p className="text-[11px] lg:text-xs leading-snug mb-2 flex-1" style={{color:'#9db09f'}}>{m.desc}</p>
              <p className="text-[11px] lg:text-xs font-semibold truncate" style={{color:m.footColor}}>{m.foot}</p>
            </button>
          ))}
        </div>

        <button onClick={()=>goPage('panduan')} className="w-full mt-3 lg:mt-4 rounded-2xl p-4 lg:p-5 flex items-center gap-4 text-left"
          style={{background:'var(--sage-mist)',border:'1px dashed var(--sage-mid)',cursor:'pointer'}}>
          <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{background:'white',color:'var(--sage-dark)'}}>{Ic.guide}</div>
          <div className="flex-1 min-w-0">
            <p className="font-serif font-bold text-base lg:text-lg" style={{color:'var(--sage-deep)'}}>Panduan</p>
            <p className="text-xs" style={{color:'#7a9482'}}>Pelajari urutan terbaik memakai Janji Suci.</p>
          </div>
          <span className="text-xs font-bold whitespace-nowrap" style={{color:'var(--gold)'}}>Mulai dari sini →</span>
        </button>
      </div>

    </div>
  );
}

function ChecklistPage({ list, setList, loading, data, goPage }) {
  const [search, setSearch] = useState('');
  const [fKat, setFKat] = useState('semua');
  const [fStatus, setFStatus] = useState('semua');
  const [fPrio, setFPrio] = useState('semua');
  const [draft, setDraft] = useState(null);      // item yang sedang ditambah/diedit
  const [exporting, setExporting] = useState(false);
  const printRef = useRef(null);

  const done = list.filter(c=>c.done).length;
  const pct = list.length ? Math.round(done/list.length*100) : 0;
  const lateCount = list.filter(ckLate).length;
  const highOpen = list.filter(c=>!c.done && ckPrio(c)==='tinggi').length;
  const cats = uniqOpts([...CHECKLIST_CATS, ...list.map(c=>c.category)]);

  const save = (patch) => setList(p=>p.map(c=>c.id===patch.id?{...c,...patch}:c));
  const toggleDone = (c) => {
    save({ id:c.id, done:!c.done, status: c.done ? 'proses' : c.status });
    toast(c.done ? 'Checklist dibuka lagi' : 'Checklist selesai', c.done ? 'Status dikembalikan ke proses.' : undefined);
  };
  const remove = (c) => { if (!confirmHapus('checklist', c.title)) return; setList(p=>p.filter(x=>x.id!==c.id)); toast('Checklist dihapus', 'Daftar tugas sudah diperbarui.'); };

  const openNew = () => setDraft({ __new:true, id:Date.now(), title:'', category:'Administrasi', pic:'', deadlineDisplay:'', prioritas:'sedang', status:'belum', desc:'', note:'', done:false });
  const openEdit = (c) => setDraft({ ...c, prioritas: ckPrio(c), status: c.done ? 'selesai' : (c.status==='proses'?'proses':'belum') });
  const commit = () => {
    if (!draft.title.trim()) { alert('Judul checklist wajib diisi.'); return; }
    const { __new, ...d } = draft;
    const item = { ...d, title:d.title.trim(), category:(d.category||'Lainnya').trim(), urgent: d.prioritas==='tinggi', done: d.status==='selesai', status: d.status==='selesai' ? 'proses' : d.status };
    if (__new) setList(p=>[...p, item]); else save(item);
    setDraft(null);
    toast(__new ? 'Checklist ditambahkan' : 'Checklist tersimpan');
  };
  const setD = (k,v) => setDraft(d=>({...d,[k]:v}));

  const applyTemplate = (tpl) => {
    const have = new Set(list.map(c=>(c.title||'').trim().toLowerCase()));
    const base = Date.now();
    const fresh = tpl.items.filter(([,t])=>!have.has(t.toLowerCase())).map(([cat,title,desc,days,prio],i)=>({
      id: base+i, category:cat, title, desc, prioritas:prio, urgent: prio==='tinggi', status:'belum', done:false,
      deadlineDisplay: deadlineFrom(data, days), pic:'', note:`Dibuat dari Template ${tpl.name}`,
    }));
    if (!fresh.length) { toast('Template sudah lengkap', `Semua checklist dari ${tpl.name} sudah ada.`); return; }
    setList(p=>[...p, ...fresh]);
    toast('Template ditambahkan', `${fresh.length} checklist baru dari ${tpl.name}.`);
  };

  const q = search.trim().toLowerCase();
  const shown = list
    .filter(c => !q || [c.title,c.desc,c.note,c.pic,c.category].some(x=>(x||'').toLowerCase().includes(q)))

    .filter(c => fStatus==='semua' || ckStatus(c)===fStatus)

  );

  return (
    <div>
      <ModHero eyebrow="Janji Suci Checklist" title="Checklist Persiapan"
        desc="Kelola semua tugas penting sebelum hari pernikahan. Tandai yang sudah selesai dan pantau deadline yang mendekat."

        goPage={goPage}/>

      <StatGrid items={[
        {label:'Progress', value:`${pct}%`, sub:`${done} dari ${list.length} selesai`},
        {label:'Total Checklist', value:list.length, sub:'Semua kategori persiapan'},
        {label:'Terlambat', value:lateCount, sub:'Deadline sudah lewat', color: lateCount?'var(--rust)':null},

        <h3 className="mod-title text-2xl mb-1">Mulai dari checklist yang sudah terstruktur</h3>
        <p className="text-xs mb-5" style={{color:'#9db09f'}}>Pilih template sesuai kondisi persiapan. Sistem hanya menambahkan checklist baru tanpa menggandakan item yang sudah ada{data?.tanggal ? ', dan deadline dihitung otomatis dari tanggal acara' : ''}.</p>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          {CK_TEMPLATES.map(t=>{
            const exist = t.items.filter(([,title])=>list.some(c=>(c.title||'').trim().toLowerCase()===title.toLowerCase())).length;
            return (
              <div key={t.id} className="rounded-2xl p-4 flex flex-col" style={{background:'var(--sage-mist)'}}>

                <p className="text-xs flex-1 mb-3" style={{color:'#7a9482',lineHeight:1.6}}>{t.desc}</p>
                <div className="flex items-center justify-between gap-2">
                  <span className="text-[11px]" style={{color:'#9db09f'}}>{exist}/{t.items.length} sudah ada</span>

                </div>
              </div>
            );
          })}
        </div>
      </div>

      <FilterBar search={search} setSearch={setSearch} placeholder="Cari checklist…" selects={[
        {value:fKat, set:setFKat, label:'Kategori', options:[['semua','Semua kategori'], ...cats.map(c=>[c,c])]},
        {value:fStatus, set:setFStatus, label:'Status', options:[['semua','Semua status'],['belum','Belum mulai'],['proses','Proses'],['terlambat','Terlambat'],['selesai','Selesai']]},
        {value:fPrio, set:setFPrio, label:'Prioritas', options:[['semua','Semua prioritas'],['tinggi','Tinggi'],['sedang','Sedang'],['rendah','Rendah']]},
      ]}/>

      {list.length===0 ? (

      ) : shown.length===0 ? (
        <EmptyMod icon="🔍" text="Tidak ada checklist yang cocok dengan filter."/>
      ) : (
        <div className="space-y-3">
          {shown.map(c=>{
            const st = ckStatus(c), pr = ckPrio(c);
            return (
              <ModItem key={c.id} accent={CK_ACCENT[st]}
                chips={<><Chip>{c.category}</Chip><Chip tone={prioTone(pr)}>{pr}</Chip><Chip tone={CK_STATUS_TONE[st]}>{CK_STATUS_LABEL[st]}</Chip></>}
                title={c.title} titleColor={st==='selesai'?'#23854a':st==='terlambat'?'#8a6d42':null}
                meta={[c.deadlineDisplay && `Deadline: ${dispShort(c.deadlineDisplay)}${st==='terlambat'?` · lewat ${-dispDays(c.deadlineDisplay)} hari`:''}`, c.pic && `PIC: ${c.pic}`]}
                desc={c.desc} note={c.note}
                actions={[
                  {label: c.done?'Buka Lagi':'Tandai Selesai', primary: !c.done, onClick:()=>toggleDone(c)},

      )}

      <Modal open={!!draft} title={draft?.__new ? 'Tambah Checklist Baru' : 'Mode Edit Checklist'} sub="Isi detail tugas agar persiapan lebih terkontrol."
        onClose={()=>setDraft(null)} onSave={commit} saveLabel={draft?.__new ? 'Tambah Checklist' : 'Simpan Perubahan'}>

          <div className="mod-form">

      {/* Tabel tersembunyi untuk export JPG */}

          <PrintHead data={data} sub={`Checklist Persiapan — ${done}/${list.length} selesai (${pct}%)`}/>

/* Hitungan per item budget */
const bStatus = b => b.statusBayar || ((Number(b.dp)||0)>0 ? 'dp' : 'belum');
const bBase = b => (Number(b.realisasi)||0) > 0 ? Number(b.realisasi) : (Number(b.estimasi)||0);
const bPaid = b => bStatus(b)==='lunas' ? bBase(b) : (Number(b.dp)||0);
const bSisa = b => bStatus(b)==='lunas' ? 0 : Math.max(bBase(b) - (Number(b.dp)||0), 0);
const B_STATUS_LABEL = { belum:'belum bayar', dp:'DP', lunas:'lunas' };
const B_STATUS_TONE = { belum:'rust', dp:'gold', lunas:'green' };
const B_ACCENT = { belum:'#e3a7a0', dp:'var(--gold)', lunas:'#3fa35f' };

/* Item budget otomatis dari Vendor (deal) & Seserahan — dipanggil di App */
function syncedBudgetItems(vendors, seserahan) {
  const out = [];
  (vendors||[]).filter(v=>v.status==='deal' && Number(v.harga)>0).forEach(v=>{
    const st = v.statusBayar==='lunas' ? 'lunas' : (Number(v.dp)>0 || v.statusBayar==='dp') ? 'dp' : 'belum';
    out.push({ id:'sync-v-'+v.id, source:'vendor', vendorId:v.id, cat:'Vendor', label:`Vendor – ${v.name||v.cat}`,
      estimasi:Number(v.harga)||0, realisasi:Number(v.harga)||0, dp:Number(v.dp)||0, statusBayar:st,
      tglBayar:v.tglDP||'', deadlineLunas:v.jatuhTempoDisplay||'', linkBukti:v.linkInvoice||'', note:v.paket?`Paket: ${v.paket}`:'' });
  });
  const ses = seserahan||[];
  if (ses.length) {
    const rencana = ses.reduce((a,s)=>a+(Number(s.harga)||0)*(Number(s.qty)||1),0);
    const bayar = ses.reduce((a,s)=>a+(Number(s.bayar)||0),0);
    const allDone = ses.every(s=>s.status==='sudah');
    out.push({ id:'sync-seserahan', source:'seserahan', vendorId:null, cat:'Seserahan', label:'Mahar & Seserahan',
      estimasi:rencana, realisasi: allDone ? (bayar||rencana) : 0, dp: allDone ? 0 : bayar, statusBayar: allDone ? 'lunas' : bayar>0 ? 'dp' : 'belum',
      tglBayar:'', deadlineLunas:'', linkBukti:'', note:`${ses.filter(s=>s.status==='sudah').length}/${ses.length} item sudah dibeli` });
  }
  return out;
}

    const { __new, ...d } = draft;
    const item = { ...d, label:d.label.trim(), cat:(d.cat||'Lain-lain').trim(), estimasi:Number(d.estimasi)||0, realisasi:Number(d.realisasi)||0, dp:Number(d.dp)||0 };
    if (__new) setBudgetItems(p=>[...p, item]); else saveItem(item);
    setDraft(null); toast(__new ? 'Budget ditambahkan' : 'Budget tersimpan');
  };
  const onPickBukti = (file) => { const f = pickFile(file); if (!f) return; if (draft.buktiUrl) { try { URL.revokeObjectURL(draft.buktiUrl); } catch(e) {} } setDraft(d=>({...d, buktiUrl:f.url, buktiName:f.name, buktiType:f.type})); };

  const saveTarget = () => { onUpdateBudget(parseRpInput(targetDraft)); setEditTarget(false); toast('Target budget tersimpan'); };

  const q = search.trim().toLowerCase();
  const shown = budgetItems
    .filter(b => !q || [b.label,b.cat,b.note].some(x=>(x||'').toLowerCase().includes(q)))
    .filter(b => fKat==='semua' || b.cat===fKat)
    .filter(b => fStatus==='semua' || bStatus(b)===fStatus);

  const exportJpg = async () => { setExporting(true); await exportNodeJpg(printRef.current, `Budget-${data?.namaW||'Mempelai'}-${data?.namaP||'Mempelai'}.jpg`); setExporting(false); };

  return (
    <div>
      <ModHero eyebrow="Janji Suci Budget" title="Budget Planner"
        desc="Pantau estimasi, realisasi, DP, sisa pembayaran, dan status pelunasan agar biaya pernikahan tetap terkendali."
        actions={[{label:'Tambah Budget', primary:true, onClick:openNew}, {label: exporting?'Menyiapkan…':'Export JPG', onClick:exportJpg, disabled:exporting}]}
        goPage={goPage}/>

      <div className="card p-5 lg:p-7 mb-4">
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 items-center">
          <div>
            <p className="text-xs mb-1" style={{color:'#7a9482'}}>Target Budget</p>
            {!editTarget ? (
              <div className="flex items-center gap-3 flex-wrap">
                <p className="mod-title text-3xl lg:text-4xl" style={{fontStyle:'normal',fontWeight:700}}>{fmt(target)}</p>
                <button onClick={()=>{setTargetDraft(target?fmtRpInput(String(target)):''); setEditTarget(true);}} className="mod-btn mod-btn-soft mod-btn-sm">Ubah</button>
              </div>
            ) : (
              <div className="flex items-center gap-2 flex-wrap">
                <div style={{position:'relative',width:'220px',maxWidth:'100%'}}>
                  <span style={{position:'absolute',left:'14px',top:'50%',transform:'translateY(-50%)',fontSize:'13px',fontWeight:600,color:'var(--sage-dark)'}}>{curSym()}</span>
                  <input autoFocus className="inp" style={{paddingLeft: curSym().length>2 ? '48px' : '38px'}} inputMode="numeric" value={targetDraft} onChange={e=>setTargetDraft(fmtRpInput(e.target.value))} onKeyDown={e=>e.key==='Enter'&&saveTarget()}/>
                </div>
                <button onClick={saveTarget} className="mod-btn mod-btn-primary mod-btn-sm">Simpan</button>
                <button onClick={()=>setEditTarget(false)} className="mod-btn mod-btn-ghost mod-btn-sm">Batal</button>
              </div>
            )}
            <div className="mt-4 pt-4" style={{borderTop:'1px solid var(--sage-mist)'}}>
              <p className="text-xs mb-1" style={{color:'#7a9482'}}>Mata Uang</p>
              {!editCur ? (
                <div className="flex items-center gap-3 flex-wrap">
                  <p className="mod-title text-2xl">{APP_CUR}</p>
                  <button onClick={()=>setEditCur(true)} className="mod-btn mod-btn-soft mod-btn-sm">Ubah</button>
                  <span className="text-xs" style={{color:'#9db09f'}}>{APP_CUR} — {(CURRENCIES[APP_CUR]||CURRENCIES.IDR).name}</span>
                </div>
              ) : (
                <div className="flex items-center gap-2 flex-wrap">
                  <div style={{width:'260px',maxWidth:'100%'}}>
                    <Dropdown value={APP_CUR} onChange={v=>{ onUpdateCurrency(v); setEditCur(false); toast('Mata uang diperbarui', `Semua nominal sekarang ditampilkan dalam ${v}.`); }}
                      options={Object.entries(CURRENCIES).map(([k,c])=>[k,`${k} — ${c.name}`])}/>
                  </div>
                  <button onClick={()=>setEditCur(false)} className="mod-btn mod-btn-ghost mod-btn-sm">Batal</button>
                </div>
              )}
            </div>
            <p className="text-xs mt-3" style={{color:'#9db09f'}}>
              Terpakai: {fmt(totReal)} • Sisa target: <b style={{color: target-totReal<0?'var(--rust)':'var(--sage-dark)'}}>{target-totReal<0?'-':''}{fmt(Math.abs(target-totReal))}</b>
            </p>
          </div>
          <div>
            <div className="flex justify-between text-xs mb-2"><span style={{color:'#7a9482'}}>Penggunaan budget</span><b style={{color: usePct>100?'var(--rust)':'var(--gold)'}}>{target?`${usePct}%`:'—'}</b></div>
            <div className="prog-track" style={{height:'10px'}}><div className="prog-fill" style={{width:`${Math.min(usePct,100)}%`, background: usePct>100?'var(--rust)':usePct>85?'linear-gradient(90deg,var(--gold),var(--rust))':undefined}}/></div>
            <p className="text-[11px] mt-2" style={{color: usePct>100?'var(--rust)':'#9db09f'}}>
              {!target ? 'Set target budget supaya penggunaan bisa dipantau.' : usePct>100 ? `Over budget ${fmt(totReal-target)} dari target.` : usePct>85 ? 'Hampir menyentuh target — cek ulang pos yang bisa dihemat.' : 'Masih aman di bawah target.'}
            </p>
          </div>
        </div>
      </div>

      <StatGrid items={[
        {label:'Estimasi', value:fmt(totEst), sub:'Total rencana biaya'},
        {label:'Realisasi', value:fmt(totReal), sub:'Total harga final'},
        {label:'Sudah Dibayar', value:fmt(totPaid), sub:'DP + pelunasan'},
        {label:'Sisa Bayar', value:fmt(totSisa), sub:`${lateCount} jatuh tempo lewat`, subColor: lateCount?'var(--rust)':null},
      ]}/>

      <FilterBar search={search} setSearch={setSearch} placeholder="Cari item budget…" selects={[
        {value:fKat, set:setFKat, label:'Kategori', options:[['semua','Semua kategori'], ...cats.map(c=>[c,c])]},
        {value:fStatus, set:setFStatus, label:'Status', options:[['semua','Semua status'],['belum','Belum bayar'],['dp','DP'],['lunas','Lunas']]},
      ]}/>

      {budgetItems.length===0 ? (
        <EmptyMod icon="💰" text="Belum ada item budget." action={{label:'Tambah Budget', onClick:openNew}}/>
      ) : shown.length===0 ? (
        <EmptyMod icon="🔍" text="Tidak ada item budget yang cocok dengan filter."/>
      ) : (
        <div className="space-y-3">
          {shown.map(b=>{
            const st = bStatus(b);
            const late = st!=='lunas' && isLateDisp(b.deadlineLunas);
            const over = (Number(b.realisasi)||0) > (Number(b.estimasi)||0) && Number(b.estimasi)>0;
            return (
              <ModItem key={b.id} accent={late?'var(--rust)':B_ACCENT[st]}
                chips={<><Chip>{b.cat}</Chip><Chip tone={B_STATUS_TONE[st]}>{B_STATUS_LABEL[st]}</Chip>{late && <Chip tone="rust">jatuh tempo lewat</Chip>}{over && <Chip tone="rust">over estimasi</Chip>}</>}
                title={b.label} titleColor={st==='lunas'?'#23854a':null}
                meta={[`Base biaya: ${fmt(bBase(b))}`, `Bayar: ${b.tglBayar?dispShort(b.tglBayar):'Tanpa tanggal'}`,
                  <span style={late?{color:'var(--rust)',fontWeight:600}:null}>Pelunasan: {b.deadlineLunas?dispShort(b.deadlineLunas):'Tanpa tanggal'}</span>]}
                note={b.note}
                actions={[
                  st!=='lunas' ? {label:'Tandai Lunas', primary:true, onClick:()=>markLunas(b)} : {label:'Buka Lagi', onClick:()=>reopen(b)},
                  b.source==='vendor' ? {label:'Buka Vendor', onClick:()=>goPage('vendor')} : b.source==='seserahan' ? {label:'Buka Seserahan', onClick:()=>goPage('seserahan')} : {label:'Edit', onClick:()=>openEdit(b)},
                  !b.source && {label:'Hapus', danger:true, onClick:()=>remove(b)},
                ].filter(a=>!(b.source==='seserahan' && a && (a.label==='Tandai Lunas'||a.label==='Buka Lagi')))}>
                <div className="mod-mini">
                  <div><p className="mod-mini-l">Estimasi</p><p className="mod-mini-v">{fmt(b.estimasi)}</p></div>
                  <div><p className="mod-mini-l">Realisasi</p><p className="mod-mini-v" style={over?{color:'var(--rust)'}:null}>{fmt(b.realisasi)}</p></div>
                  <div><p className="mod-mini-l">{st==='lunas'?'Dibayar':'DP'}</p><p className="mod-mini-v">{fmt(bPaid(b))}</p></div>
                  <div><p className="mod-mini-l">Sisa</p><p className="mod-mini-v" style={bSisa(b)>0?{color:'var(--rust)'}:null}>{fmt(bSisa(b))}</p></div>
                </div>
                {(b.linkBukti || b.buktiUrl) && (
                  <div className="flex flex-wrap gap-2 mt-3">
                    {b.linkBukti && <a href={b.linkBukti} target="_blank" rel="noopener noreferrer" className="mod-btn mod-btn-soft mod-btn-sm">Link bukti bayar</a>}
                    {b.buktiUrl && <a href={b.buktiUrl} target="_blank" rel="noopener noreferrer" className="mod-btn mod-btn-soft mod-btn-sm">File: {b.buktiName}</a>}
                  </div>
                )}
                {b.source && <p className="text-[11px] mt-3" style={{color:'#9db09f'}}>Auto-sync dari {b.source==='vendor'?'Vendor':'Mahar & Seserahan'} — ubah datanya di halaman tersebut.</p>}
              </ModItem>
            );
          })}
        </div>
      )}

      <Modal open={!!draft} title={draft?.__new ? 'Tambah Detail Budget' : 'Edit Detail Budget'} sub="Isi estimasi, realisasi, pembayaran, dan deadline pelunasan."
        onClose={()=>setDraft(null)} onSave={commit} saveLabel={draft?.__new ? 'Tambah Budget' : 'Simpan Perubahan'}>
        {draft && (
          <div className="mod-form">
            <Fld label="Nama Item" span2><TextIn value={draft.label} onChange={v=>setD('label',v)} placeholder="Contoh: DP Venue"/></Fld>
            <Fld label="Kategori"><CatSelect value={draft.cat} onChange={v=>setD('cat',v)} options={cats}/></Fld>
            <Fld label="Status Pembayaran"><Sel value={draft.statusBayar} onChange={v=>setD('statusBayar',v)} options={[['belum','Belum bayar'],['dp','DP'],['lunas','Lunas']]}/></Fld>
            <Fld label="Estimasi Biaya"><RpInput value={draft.estimasi} onChange={v=>setD('estimasi',v)} placeholder="10.000.000"/></Fld>
            <Fld label="Realisasi Biaya" hint="Harga final yang disepakati."><RpInput value={draft.realisasi} onChange={v=>setD('realisasi',v)} placeholder="12.000.000"/></Fld>
            <Fld label="Jumlah DP"><RpInput value={draft.dp} onChange={v=>setD('dp',v)} placeholder="5.000.000"/></Fld>
            <Fld label="Tanggal Pembayaran"><DateField value={draft.tglBayar||''} onChange={v=>setD('tglBayar',v)}/></Fld>
            <Fld label="Deadline Pelunasan" hint="Otomatis masuk Reminder."><DateField value={draft.deadlineLunas||''} onChange={v=>setD('deadlineLunas',v)}/></Fld>
            <Fld label="Link Bukti Pembayaran"><TextIn value={draft.linkBukti} onChange={v=>setD('linkBukti',v)} placeholder="https://…" inputMode="url"/></Fld>
            <Fld label="Upload Bukti Pembayaran" span2><FileField name={draft.buktiName} url={draft.buktiUrl} type={draft.buktiType} onPick={onPickBukti} onRemove={()=>setDraft(d=>({...d,buktiUrl:null,buktiName:'',buktiType:''}))}/></Fld>
            <Fld label="Catatan" span2><Txt value={draft.note} onChange={v=>setD('note',v)} placeholder="Catatan pembayaran atau kesepakatan"/></Fld>
          </div>
        )}
      </Modal>

      <div style={{height:0, overflow:'hidden'}} aria-hidden="true">
        <div ref={printRef} style={{width:'960px', background:'white', fontFamily:"'DM Sans', sans-serif"}}>
          <PrintHead data={data} sub={`Ringkasan Budget — Target ${fmt(target)} · Realisasi ${fmt(totReal)} · Sisa bayar ${fmt(totSisa)}`}/>
          <div style={{padding:'24px 40px 30px'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr>{['No','Item','Kategori','Estimasi','Realisasi','Dibayar','Sisa','Status','Pelunasan'].map(h=><th key={h} style={pth}>{h}</th>)}</tr></thead>
              <tbody>{budgetItems.map((b,i)=>(
                <tr key={b.id}>
                  <td style={ptd(i)}>{i+1}</td><td style={{...ptd(i),fontWeight:600}}>{b.label}</td><td style={ptd(i)}>{b.cat}</td>
                  <td style={ptd(i)}>{fmt(b.estimasi)}</td><td style={ptd(i)}>{fmt(b.realisasi)}</td><td style={ptd(i)}>{fmt(bPaid(b))}</td>
                  <td style={ptd(i)}>{fmt(bSisa(b))}</td><td style={ptd(i)}>{B_STATUS_LABEL[bStatus(b)]}</td><td style={ptd(i)}>{b.deadlineLunas||'—'}</td>
                </tr>))}</tbody>
            </table>
            <div style={{marginTop:'20px',textAlign:'center',fontSize:'10px',color:'#9db09f'}}>Dibuat dengan Janji Suci Wedding Planner</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ TAMU / GUEST PAGE ═══════════════ */
const GCATS = ['Keluarga Wanita','Keluarga Pria','Teman','Kolega / Kantor','Tetangga','Lainnya'];
const GSTATUS = {belum:'Belum Diundang',diundang:'Sudah Diundang',hadir:'Konfirmasi Hadir',tidak:'Tidak Hadir'};
const GCOLOR = {belum:{bg:'var(--sage-mist)',color:'#9db09f'},diundang:{bg:'var(--gold-light)',color:'#8a6d42'},hadir:{bg:'var(--sage-light)',color:'var(--sage-dark)'},tidak:{bg:'var(--rust-light)',color:'var(--rust)'}};

function buildWaLink(guest, undanganLink, data) {
  const phoneRaw = (guest.contact||'').replace(/\D/g,'');
  const phone = phoneRaw.startsWith('0') ? '62'+phoneRaw.slice(1) : phoneRaw;
  const namaTamu = guest.name || 'Bapak/Ibu/Saudara/i';
  const namaPasangan = `${data?.namaW||'Mempelai Wanita'} & ${data?.namaP||'Mempelai Pria'}`;

  let msg = `Kepada Yth.\nBapak/Ibu/Saudara/i\n${namaTamu}\n\n`;
  msg += `Assalamualaikum Warahmatullahi Wabarakatuh\n\n`;
  msg += `Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami.\n\n`;
  if (undanganLink) {
    msg += `Berikut link undangan kami, untuk info lengkap dari acara, bisa kunjungi:\n\n${undanganLink}\n\n`;
  }
  msg += `Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.\n\n`;
  msg += `Wassalamualaikum Warahmatullahi Wabarakatuh\n\n`;
  msg += `Terima kasih,\n\nHormat kami,\n${namaPasangan}`;

  return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
}

function GuestPage({ guests, setGuests, data, undanganLink, setUndanganLink, goPage }) {
  const [exp, setExp] = useState(null);
  const [filter, setFilter] = useState('semua');
  const [search, setSearch] = useState('');
  const [view, setView] = useState('list'); // list | meja
  const [showBulk, setShowBulk] = useState(false);
  const [bulkText, setBulkText] = useState('');
  const [exporting, setExporting] = useState(false);
  const printRef = useRef(null);

  const add = () => { const id=Date.now(); setGuests(g=>[...g,{id,name:'',cat:'Teman',jumlah:1,contact:'',status:'belum',meja:''}]); setExp(id); };
  const upd = (id,k,v) => setGuests(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));
  const del = id => setGuests(p=>p.filter(x=>x.id!==id));

  const addBulk = () => {
    const lines = bulkText.split('\n').map(l=>l.trim()).filter(Boolean);
    if (lines.length===0) return;
    const newGuests = lines.map((line, i) => {
      const parts = line.split(',').map(p=>p.trim());
      const name = parts[0] || 'Tamu';
      const cat = GCATS.includes(parts[1]) ? parts[1] : 'Lainnya';
      const jumlah = parts[2] && !isNaN(Number(parts[2])) ? Number(parts[2]) : 1;
      const contact = parts[3] || '';
      return { id:Date.now()+i, name, cat, jumlah, contact, status:'belum', meja:'' };
    });
    setGuests(g=>[...g, ...newGuests]);
    setBulkText(''); setShowBulk(false);
  };

  const total = guests.reduce((a,g)=>a+(Number(g.jumlah)||1),0);
  const hadir = guests.filter(g=>g.status==='hadir').reduce((a,g)=>a+(Number(g.jumlah)||1),0);
  const tidak = guests.filter(g=>g.status==='tidak').reduce((a,g)=>a+(Number(g.jumlah)||1),0);
  const respRate = total>0 ? Math.round(((hadir+tidak)/total)*100) : 0;

  const estimasi = Number(data?.tamu)||0;
  const capPct = estimasi>0 ? Math.round(total/estimasi*100) : 0;
  const overCap = estimasi>0 && total>estimasi;

  let filtered = filter==='semua' ? guests : guests.filter(g=>g.status===filter);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    filtered = filtered.filter(g=>(g.name||'').toLowerCase().includes(q));
  }

  const byTable = {};
  filtered.forEach(g=>{
    const t = g.meja ? String(g.meja) : 'Belum Ditentukan';
    if (!byTable[t]) byTable[t] = [];
    byTable[t].push(g);
  });
  const tableKeys = Object.keys(byTable).sort((a,b)=>{
    if (a==='Belum Ditentukan') return 1;
    if (b==='Belum Ditentukan') return -1;
    return (Number(a)||0)-(Number(b)||0);
  });

  const exportPdf = async () => {
    if (!printRef.current || guests.length===0) return;
    setExporting(true);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = await html2canvas(printRef.current, { scale:2, useCORS:true, backgroundColor:'#ffffff' });
      const { jsPDF } = window.jspdf;
      const orientation = canvas.width >= canvas.height ? 'landscape' : 'portrait';
      const pdf = new jsPDF({ orientation, unit:'px', format:[canvas.width, canvas.height] });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, canvas.width, canvas.height);
      pdf.save(`Daftar-Tamu-${(data?.namaW||'Mempelai')}-${(data?.namaP||'Mempelai')}.pdf`.replace(/\s+/g,''));
    } catch(e) {
      console.error(e);
      alert('Gagal membuat file export. Coba lagi sebentar.');
    }
    setExporting(false);
  };

  const GuestCard = (g) => (
    <div key={g.id} className="card overflow-hidden self-start">
      <div className="flex items-center gap-3 px-4 py-3.5 cursor-pointer" onClick={()=>setExp(exp===g.id?null:g.id)}>
        <div className="w-9 h-9 rounded-xl flex items-center justify-center text-white text-xs font-bold shrink-0" style={{background:'var(--sage-dark)'}}>{g.name?g.name[0].toUpperCase():'?'}</div>
        <div className="flex-1 min-w-0"><p className="font-semibold text-sm truncate" style={{color:'var(--sage-deep)'}}>{g.name||'Tamu baru'}</p><p className="text-xs" style={{color:'#9db09f'}}>{g.cat} • {g.jumlah||1} orang{g.meja?` • Meja ${g.meja}`:''}</p></div>
        <span className="text-[10px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap" style={GCOLOR[g.status]}>{GSTATUS[g.status]}</span>
      </div>
      {exp===g.id && (
        <div className="px-4 pb-4 pt-3 border-t space-y-3 anim-fadeup" style={{borderColor:'var(--sage-mist)'}} onClick={e=>e.stopPropagation()}>
          <div>
            <label className="lbl text-xs">Nama Tamu</label>
            <input className="inp" value={g.name} onChange={e=>upd(g.id,'name',e.target.value)} placeholder="Contoh: Haris"/>
            <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'8px'}}>
              {['& Isteri','& Suami','& Partner','sekeluarga','& Anak','+1 orang'].map(suffix=>(
                <button key={suffix} type="button"
                  onClick={()=>upd(g.id,'name', ((g.name||'').trim() + ' ' + suffix).trim())}
                  style={{fontSize:'11px',fontWeight:600,padding:'5px 11px',borderRadius:'999px',
                    background:'var(--sage-mist)',color:'var(--sage-dark)',border:'1px solid var(--sage-mid)',cursor:'pointer'}}>
                  + {suffix}
                </button>
              ))}
            </div>
            <p className="text-xs mt-1.5" style={{color:'#9db09f'}}>Ketik nama dulu, lalu klik salah satu tombol di atas untuk menambahkan keterangan — contoh hasil: "Haris & Isteri", "Haji Ridwan sekeluarga".</p>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="lbl text-xs">Kategori</label><Dropdown value={g.cat} onChange={v=>upd(g.id,'cat',v)} options={GCATS}/></div>
            <div><label className="lbl text-xs">Jumlah Orang</label><input type="number" className="inp" value={g.jumlah} onChange={e=>upd(g.id,'jumlah',e.target.value)} placeholder="1"/></div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="lbl text-xs">Kontak WA</label><input className="inp" value={g.contact} onChange={e=>upd(g.id,'contact',e.target.value)} placeholder="08xxxxxxxxxx"/></div>
            <div><label className="lbl text-xs">No. Meja</label><input className="inp" value={g.meja} onChange={e=>upd(g.id,'meja',e.target.value)} placeholder="Opsional"/></div>
          </div>
          <div>
            <label className="lbl text-xs">Status RSVP</label>
            <div className="grid grid-cols-2 gap-2">
              {Object.keys(GSTATUS).map(s=>(
                <button key={s} onClick={()=>upd(g.id,'status',s)} className="py-2 rounded-xl text-xs font-bold transition-all" style={g.status===s?{background:'var(--sage-dark)',color:'white'}:{background:'var(--sage-mist)',color:'#9db09f'}}>{GSTATUS[s]}</button>
              ))}
            </div>
          </div>
          {g.contact && (
            <a href={buildWaLink(g, undanganLink, data)} target="_blank" rel="noopener noreferrer"
              className="btn-sm" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',background:'#25D366',color:'white',textDecoration:'none',padding:'10px',borderRadius:'12px',fontWeight:700}}>

const waNumber = raw => { const d = String(raw||'').replace(/\D/g,''); return d.startsWith('0') ? '62'+d.slice(1) : d; };
const igUrl = raw => { const s = String(raw||'').trim(); if (!s) return ''; if (/^https?:\/\//i.test(s)) return s; return 'https://instagram.com/'+s.replace(/^@/,'').replace(/\s+/g,''); };
const webUrl = raw => { const s = String(raw||'').trim(); if (!s) return ''; return /^https?:\/\//i.test(s) ? s : 'https://'+s; };
const todayDisp = () => { const d = new Date(); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };

function VendorPage({ vendors, setVendors, onBack, goPage, data }) {
  const [search, setSearch] = useState('');
  const [fKat, setFKat] = useState('semua');
  const [fStatus, setFStatus] = useState('semua');
  const [fPay, setFPay] = useState('semua');
  const [draft, setDraft] = useState(null);
  const [exporting, setExporting] = useState(false);
  const printRef = useRef(null);

  const list = vendors.filter(v => v.name || v.contact || Number(v.harga)>0 || v.status!=='belum');
  const sisaBayar = v => v.statusBayar==='lunas' ? 0 : Math.max((Number(v.harga)||0)-(Number(v.dp)||0),0);
  const deal = list.filter(v=>v.status==='deal');
  const belumLunas = deal.filter(v=>v.statusBayar!=='lunas');
  const lewat = belumLunas.filter(v=>isLateDisp(v.jatuhTempoDisplay)).length;
  const nilai = list.filter(v=>v.status!=='batal').reduce((a,v)=>a+(Number(v.harga)||0),0);
  const cats = uniqOpts([...VCATS, ...list.map(v=>v.cat)]);

  const save = (patch) => setVendors(p=>p.map(v=>v.id===patch.id?{...v,...patch}:v));
  const markDeal = v => { save({ id:v.id, status:'deal', tglDeal: v.tglDeal || todayDisp(), statusBayar: v.statusBayar || 'belum_dp' }); toast('Vendor deal', `${v.name||v.cat} sudah disepakati. Masuk ke Budget otomatis.`); };
  const markLunas = v => { save({ id:v.id, statusBayar:'lunas' }); toast('Vendor lunas', `Pembayaran ${v.name||v.cat} ditandai lunas.`); };
  const reopen = v => { save({ id:v.id, statusBayar: Number(v.dp)>0 ? 'dp' : 'belum_dp' }); toast('Pembayaran dibuka lagi', `${v.name||v.cat} kembali belum lunas.`); };
  const remove = v => {
    if (!confirmHapus('vendor', v.name||v.cat)) return;
    if (v.fileUrl) { try { URL.revokeObjectURL(v.fileUrl); } catch(e) {} }
    setVendors(p=>p.filter(x=>x.id!==v.id)); toast('Vendor dihapus', 'Daftar vendor sudah diperbarui.');
  };

  const blank = { name:'', cat:'Gedung', pic:'', contact:'', email:'', instagram:'', website:'', alamat:'', paket:'', harga:'', dp:'',
    status:'proses', statusBayar:'belum_dp', tglDeal:'', tglDP:'', jatuhTempoDisplay:'', rating:0, linkKontrak:'', linkInvoice:'', note:'', fileUrl:null, fileName:'', fileType:'' };
  const openNew = () => setDraft({ __new:true, id:Date.now(), ...blank });
  const openEdit = v => setDraft({ ...blank, ...v });
  const setD = (k,val) => setDraft(d=>({...d,[k]:val}));
  const commit = () => {
    if (!draft.name.trim()) { alert('Nama vendor wajib diisi.'); return; }
    const { __new, ...d } = draft;
    const item = { ...d, name:d.name.trim(), harga:Number(d.harga)||0, dp:Number(d.dp)||0, rating:Number(d.rating)||0,
      tglDeal: d.status==='deal' && !d.tglDeal ? todayDisp() : d.tglDeal };
    if (__new) setVendors(p=>[...p.filter(v=>v.name||v.contact||Number(v.harga)>0||v.status!=='belum'), item]); else save(item);
    setDraft(null); toast(__new ? 'Vendor ditambahkan' : 'Vendor tersimpan');
  };
  const onPick = file => { const f = pickFile(file); if (!f) return; setDraft(d=>({...d, fileUrl:f.url, fileName:f.name, fileType:f.type})); };

  const q = search.trim().toLowerCase();
  const shown = list
    .filter(v => !q || [v.name,v.cat,v.pic,v.paket,v.note,v.contact].some(x=>(x||'').toLowerCase().includes(q)))
    .filter(v => fKat==='semua' || v.cat===fKat)
    .filter(v => fStatus==='semua' || v.status===fStatus)
    .filter(v => fPay==='semua' || (v.statusBayar||'belum_dp')===fPay);

  const exportJpg = async () => { setExporting(true); await exportNodeJpg(printRef.current, 'daftar-vendor.jpg'); setExporting(false); };

  return (
    <div>
      <ModHero eyebrow="Janji Suci Vendor" title="Vendor Management"
        desc="Kelola vendor, kontak, paket, status deal, pembayaran, kontrak, invoice, dan catatan kesepakatan dari satu tempat."
        actions={[{label:'Tambah Vendor', primary:true, onClick:openNew}, {label: exporting?'Menyiapkan…':'Export JPG', onClick:exportJpg, disabled:exporting||!list.length}]}
        goPage={goPage}/>

      <StatGrid items={[
        {label:'Total Vendor', value:list.length, sub:'Semua kategori vendor'},
        {label:'Vendor Deal', value:deal.length, sub:'Sudah disepakati'},
        {label:'Belum Lunas', value:belumLunas.length, sub:`${lewat} lewat deadline`, subColor: lewat?'var(--rust)':null},
        {label:'Nilai Paket', value:fmt(nilai), sub:'Total harga vendor'},
      ]}/>

      <FilterBar search={search} setSearch={setSearch} placeholder="Cari vendor…" selects={[
        {value:fKat, set:setFKat, label:'Kategori', options:[['semua','Semua kategori'], ...cats.map(c=>[c,c])]},
        {value:fStatus, set:setFStatus, label:'Status', options:[['semua','Semua status'], ...Object.entries(VSTATUS).map(([k,l])=>[k,l[0].toUpperCase()+l.slice(1)])]},
        {value:fPay, set:setFPay, label:'Pembayaran', options:[['semua','Semua pembayaran'],['belum_dp','Belum bayar'],['dp','DP'],['lunas','Lunas']]},
      ]}/>

      {list.length===0 ? (
        <EmptyMod icon="🏛️" text="Belum ada vendor. Mulai dari vendor terpenting: venue, catering, MUA, dekorasi, dan dokumentasi." action={{label:'Tambah Vendor', onClick:openNew}}/>
      ) : shown.length===0 ? (
        <EmptyMod icon="🔍" text="Tidak ada vendor yang cocok dengan filter."/>
      ) : (
        <div className="space-y-3">
          {shown.map(v=>{
            const pay = v.statusBayar || 'belum_dp';
            const late = v.status==='deal' && pay!=='lunas' && isLateDisp(v.jatuhTempoDisplay);
            const accent = v.status==='batal' ? '#cfd5cf' : pay==='lunas' && v.status==='deal' ? '#3fa35f' : late ? 'var(--rust)' : v.status==='deal' ? 'var(--gold)' : 'var(--sage-mid)';
            const links = [
              v.contact && {label:'Chat WhatsApp', href:`https://wa.me/${waNumber(v.contact)}`, primary:true},
              v.instagram && {label:'Instagram', href:igUrl(v.instagram)},
              v.website && {label:'Website', href:webUrl(v.website)},
              v.linkKontrak && {label:'Kontrak', href:webUrl(v.linkKontrak)},
              v.linkInvoice && {label:'Invoice', href:webUrl(v.linkInvoice)},
              v.fileUrl && {label:`File: ${v.fileName}`, href:v.fileUrl},
            ].filter(Boolean);
            return (
              <ModItem key={v.id} accent={accent}
                chips={<><Chip>{v.cat}</Chip><Chip tone={V_STATUS_TONE[v.status]||'grey'}>{VSTATUS[v.status]||v.status}</Chip><Chip tone={V_PAY_TONE[pay]}>{PAYSTATUS[pay]}</Chip>{late && <Chip tone="rust">pelunasan lewat</Chip>}</>}
                title={<span className="flex items-center gap-2.5"><span className="w-8 h-8 rounded-xl inline-flex items-center justify-center shrink-0" style={{background:VCAT_COLOR[v.cat]?.bg||'var(--sage-light)',color:VCAT_COLOR[v.cat]?.color||'var(--sage-dark)'}}>{VCAT_ICON[v.cat]||VCAT_ICON['Lainnya']}</span>{v.name||`Vendor ${v.cat}`}</span>}
                meta={null} note={v.note}
                actions={[
                  v.status!=='deal' && v.status!=='batal' && {label:'Tandai Deal', primary:true, onClick:()=>markDeal(v)},
                  v.status==='deal' && pay!=='lunas' && {label:'Tandai Lunas', primary:true, onClick:()=>markLunas(v)},
                  v.status==='deal' && pay==='lunas' && {label:'Buka Lagi', onClick:()=>reopen(v)},
                  {label:'Edit', onClick:()=>openEdit(v)},
                  {label:'Hapus', danger:true, onClick:()=>remove(v)},
                ]}>
                <p className="stars mt-1" title={v.rating?`Rating ${v.rating}/5`:'Belum dinilai'}>{'★'.repeat(v.rating||0)}<span style={{color:'#dfe6df'}}>{'★'.repeat(5-(v.rating||0))}</span></p>
                <div className="mod-mini c3">
                  <div><p className="mod-mini-l">Paket</p><p className="mod-mini-v">{v.paket||'Belum dipilih'}</p></div>
                  <div><p className="mod-mini-l">Harga</p><p className="mod-mini-v">{fmt(v.harga)}</p></div>
                  <div><p className="mod-mini-l">Pelunasan</p><p className="mod-mini-v" style={late?{color:'var(--rust)'}:null}>{v.jatuhTempoDisplay?dispShort(v.jatuhTempoDisplay):'Tanpa tanggal'}</p></div>
                </div>
                <div className="mod-item-meta mt-3">
                  {v.pic && <span>PIC: {v.pic}</span>}
                  {v.contact && <span>WA: {v.contact}</span>}
                  {v.email && <span>Email: {v.email}</span>}
                  {v.tglDeal && <span>Deal: {dispShort(v.tglDeal)}</span>}
                  {Number(v.dp)>0 && <span>DP: {fmt(v.dp)}{v.tglDP?` (${dispShort(v.tglDP)})`:''}</span>}
                  {v.status==='deal' && pay!=='lunas' && <span style={{color:'var(--rust)'}}>Sisa: {fmt(sisaBayar(v))}</span>}
                  {v.alamat && <span>📍 {v.alamat}</span>}
                </div>
                {links.length>0 && (
                  <div className="flex flex-wrap gap-2 mt-3">
                    {links.map((l,i)=><a key={i} href={l.href} target="_blank" rel="noopener noreferrer" className={`mod-btn mod-btn-sm ${l.primary?'mod-btn-primary':'mod-btn-soft'}`}>{l.label}</a>)}
                  </div>
                )}
              </ModItem>
            );
          })}
        </div>
      )}

      <Modal open={!!draft} title={draft?.__new ? 'Tambah Vendor' : 'Edit Vendor'} sub="Isi data vendor, kontak, paket, status, dan catatan kesepakatan."
        onClose={()=>setDraft(null)} onSave={commit} saveLabel={draft?.__new ? 'Tambah Vendor' : 'Simpan Perubahan'}>
        {draft && (
          <div className="mod-form">
            <Fld label="Nama Vendor" span2><TextIn value={draft.name} onChange={v=>setD('name',v)} placeholder="Contoh: Lia Wedding Decoration"/></Fld>
            <Fld label="Kategori"><CatSelect value={draft.cat} onChange={v=>setD('cat',v)} options={cats}/></Fld>
            <Fld label="Nama Kontak / PIC"><TextIn value={draft.pic} onChange={v=>setD('pic',v)} placeholder="Nama yang dihubungi"/></Fld>
            <Fld label="Nomor WhatsApp"><TextIn value={draft.contact} onChange={v=>setD('contact',v)} placeholder="08xxxxxxxxxx" inputMode="tel"/></Fld>
            <Fld label="Email"><TextIn value={draft.email} onChange={v=>setD('email',v)} placeholder="vendor@email.com" type="email"/></Fld>
            <Fld label="Instagram"><TextIn value={draft.instagram} onChange={v=>setD('instagram',v)} placeholder="@namavendor"/></Fld>
            <Fld label="Website"><TextIn value={draft.website} onChange={v=>setD('website',v)} placeholder="https://…" inputMode="url"/></Fld>
            <Fld label="Alamat" span2><Txt value={draft.alamat} onChange={v=>setD('alamat',v)} placeholder="Alamat vendor" rows={2}/></Fld>
            <Fld label="Paket Dipilih"><TextIn value={draft.paket} onChange={v=>setD('paket',v)} placeholder="Contoh: Paket Gold"/></Fld>
            <Fld label="Harga Paket"><RpInput value={draft.harga} onChange={v=>setD('harga',v)} placeholder="25.000.000"/></Fld>
            <Fld label="Status Vendor"><Sel value={draft.status} onChange={v=>setD('status',v)} options={[['belum','Belum kontak'],['proses','Survey / nego'],['deal','Deal'],['batal','Batal']]}/></Fld>
            <Fld label="Status Pembayaran"><Sel value={draft.statusBayar} onChange={v=>setD('statusBayar',v)} options={[['belum_dp','Belum bayar'],['dp','DP'],['lunas','Lunas']]}/></Fld>
            <Fld label="Jumlah DP"><RpInput value={draft.dp} onChange={v=>setD('dp',v)} placeholder="5.000.000"/></Fld>
            <Fld label="Tanggal DP"><DateField value={draft.tglDP||''} onChange={v=>setD('tglDP',v)}/></Fld>
            <Fld label="Tanggal Deal"><DateField value={draft.tglDeal||''} onChange={v=>setD('tglDeal',v)}/></Fld>
            <Fld label="Deadline Pelunasan" hint="Otomatis masuk Reminder & Budget."><DateField value={draft.jatuhTempoDisplay||''} onChange={v=>setD('jatuhTempoDisplay',v)}/></Fld>
            <Fld label="Rating Internal"><Sel value={String(draft.rating||0)} onChange={v=>setD('rating',Number(v))} options={[['0','Belum dinilai'],['5','★★★★★ Sangat puas'],['4','★★★★ Puas'],['3','★★★ Cukup'],['2','★★ Kurang'],['1','★ Tidak puas']]}/></Fld>
            <Fld label="Link Kontrak"><TextIn value={draft.linkKontrak} onChange={v=>setD('linkKontrak',v)} placeholder="https://drive.google.com/…" inputMode="url"/></Fld>
            <Fld label="Link Invoice"><TextIn value={draft.linkInvoice} onChange={v=>setD('linkInvoice',v)} placeholder="https://…" inputMode="url"/></Fld>
            <Fld label="Upload Kontrak / Invoice"><FileField name={draft.fileName} url={draft.fileUrl} type={draft.fileType} onPick={onPick} onRemove={()=>setDraft(d=>({...d,fileUrl:null,fileName:'',fileType:''}))} label="Upload file"/></Fld>
            <Fld label="Catatan Kesepakatan" span2><Txt value={draft.note} onChange={v=>setD('note',v)} placeholder="Catatan harga, fasilitas, syarat, jadwal, atau request khusus"/></Fld>
          </div>
        )}
      </Modal>

      <div style={{height:0, overflow:'hidden'}} aria-hidden="true">
        <div ref={printRef} style={{width:'1000px', background:'white', fontFamily:"'DM Sans', sans-serif"}}>
          <PrintHead data={data} sub={`Daftar Vendor — ${deal.length} deal dari ${list.length} vendor · Nilai paket ${fmt(nilai)}`}/>
          <div style={{padding:'24px 40px 30px'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr>{['No','Vendor','Kategori','Kontak','Paket','Harga','DP','Sisa','Status','Bayar'].map(h=><th key={h} style={pth}>{h}</th>)}</tr></thead>
              <tbody>{list.map((v,i)=>(
                <tr key={v.id}>
                  <td style={ptd(i)}>{i+1}</td><td style={{...ptd(i),fontWeight:600}}>{v.name||'—'}</td><td style={ptd(i)}>{v.cat}</td>
                  <td style={ptd(i)}>{[v.pic,v.contact].filter(Boolean).join(' · ')||'—'}</td><td style={ptd(i)}>{v.paket||'—'}</td>
                  <td style={ptd(i)}>{fmt(v.harga)}</td><td style={ptd(i)}>{fmt(v.dp)}</td><td style={ptd(i)}>{fmt(sisaBayar(v))}</td>
                  <td style={ptd(i)}>{VSTATUS[v.status]||v.status}</td><td style={ptd(i)}>{PAYSTATUS[v.statusBayar||'belum_dp']}</td>
                </tr>))}</tbody>
            </table>
            <div style={{marginTop:'20px',textAlign:'center',fontSize:'10px',color:'#9db09f'}}>Dibuat dengan Janji Suci Wedding Planner</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ RUNDOWN PAGE ═══════════════ */
const R_STATUS_LABEL = { belum:'belum mulai', siap:'siap', berlangsung:'berlangsung', selesai:'selesai', bermasalah:'bermasalah' };
const R_STATUS_TONE = { belum:'grey', siap:'sage', berlangsung:'blue', selesai:'green', bermasalah:'rust' };
const R_ACCENT = { belum:'var(--sage-mid)', siap:'var(--sage)', berlangsung:'#6c9bd2', selesai:'#3fa35f', bermasalah:'var(--rust)' };
const rStatus = it => it.status || 'belum';
const rMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t||''); return m ? (+m[1])*60 + (+m[2]) : 9999; };

function RundownPage({ rundown, setRundown, loading, data, onBack, goPage }) {
  const [exporting, setExporting] = useState(false);
  const [search, setSearch] = useState('');
  const [fStatus, setFStatus] = useState('semua');
  const [fLok, setFLok] = useState('semua');
  const [fPic, setFPic] = useState('semua');
  const [draft, setDraft] = useState(null);
  const [live, setLive] = useState(false);
  const printRef = useRef(null);

  /* Beda hari → rundown dibagi per hari (akad / resepsi) */
  const beda = isBedaHari(data);
  const events = weddingEvents(data);
  const [activeDay, setActiveDay] = useState(() => (nextWeddingEvent(data)||{}).key || 'akad');
  const dayOf = it => rundownDay(it);
  const activeEv = events.find(e=>e.key===activeDay) || events[0];

  const dayItems = rundown.map((it,i)=>({it,i})).filter(({it})=>!beda || dayOf(it)===activeDay)
    .sort((a,b)=>rMin(a.it.time)-rMin(b.it.time));
  const endOf = (pos) => dayItems[pos].it.endTime || (dayItems[pos+1] ? dayItems[pos+1].it.time : '');

  const upd = (i, patch) => setRundown(r=>r.map((x,idx)=>idx===i?{...x,...patch}:x));
  const setStatus = (i, st, label) => { upd(i, { status: st }); toast(label || 'Status agenda diperbarui', `${rundown[i].title} → ${R_STATUS_LABEL[st]}.`); };
  const remove = (i) => { if (!confirmHapus('agenda', rundown[i].title)) return; setRundown(r=>r.filter((_,idx)=>idx!==i)); toast('Agenda dihapus', 'Rundown sudah diperbarui.'); };

  const openNew = () => {
    const last = dayItems[dayItems.length-1];
    setDraft({ __new:true, time: last ? (last.it.endTime || '') : '', endTime:'', title:'', lokasi:'', pic:'', note:'', status:'belum', prioritas:'sedang', ...(beda?{hari:activeDay}:{}) });
  };
  const openEdit = (i) => setDraft({ __idx:i, status:'belum', prioritas:'sedang', endTime:'', ...rundown[i] });
  const setD = (k,v) => setDraft(d=>({...d,[k]:v}));
  const commit = () => {
    if (!draft.title.trim()) { alert('Nama kegiatan wajib diisi.'); return; }
    const { __new, __idx, ...d } = draft;
    const item = { ...d, title:d.title.trim() };
    if (__new) setRundown(r=>[...r, item]); else upd(__idx, item);
    if (beda && item.hari && item.hari!==activeDay) setActiveDay(item.hari);
    setDraft(null); toast(__new ? 'Agenda ditambahkan' : 'Agenda tersimpan');
  };

  const all = dayItems.map(x=>x.it);
  const count = st => all.filter(it=>rStatus(it)===st).length;
  const doneCount = count('selesai');
  const progress = all.length ? Math.round(doneCount/all.length*100) : 0;
  const lokasiOpts = uniqOpts(all.map(it=>it.lokasi));
  const picOpts = uniqOpts(all.map(it=>it.pic));

  const q = search.trim().toLowerCase();
  const shown = dayItems.map((x,pos)=>({...x,pos}))
    .filter(({it}) => !q || [it.title,it.lokasi,it.pic,it.note].some(s=>(s||'').toLowerCase().includes(q)))
    .filter(({it}) => fStatus==='semua' || rStatus(it)===fStatus)
    .filter(({it}) => fLok==='semua' || it.lokasi===fLok)
    .filter(({it}) => fPic==='semua' || it.pic===fPic);

  const exportAs = async (type) => {
    if (!printRef.current || rundown.length===0) return;
    setExporting(true);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = await html2canvas(printRef.current, { scale:2, useCORS:true, backgroundColor:'#ffffff' });
      const safeName = `Rundown-${(data.namaW||'Mempelai')}-${(data.namaP||'Mempelai')}`.replace(/\s+/g,'');
      if (type==='jpg') {
        const link = document.createElement('a'); link.download = `${safeName}.jpg`; link.href = canvas.toDataURL('image/jpeg', 0.95); link.click();
      } else {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: canvas.width >= canvas.height ? 'landscape' : 'portrait', unit:'px', format:[canvas.width, canvas.height] });
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, canvas.width, canvas.height);
        pdf.save(`${safeName}.pdf`);
      }
    } catch(e) { console.error(e); alert('Gagal membuat file export. Coba lagi sebentar.'); }
    setExporting(false);
  };

  /* ── Mode Hari-H: tampilan fokus untuk koordinator ── */
  const curPos = (() => { const b = dayItems.findIndex(x=>rStatus(x.it)==='berlangsung'); return b>=0 ? b : dayItems.findIndex(x=>rStatus(x.it)!=='selesai'); })();
  const cur = curPos>=0 ? dayItems[curPos] : null;
  const nextUp = curPos>=0 ? dayItems.slice(curPos+1).filter(x=>rStatus(x.it)!=='selesai').slice(0,3) : [];
  const finishAndNext = () => {
    if (!cur) return;
    setRundown(r=>r.map((x,idx)=>{
      if (idx===cur.i) return {...x, status:'selesai'};
      if (nextUp[0] && idx===nextUp[0].i) return {...x, status:'berlangsung'};
      return x;
    }));
    toast('Agenda selesai', nextUp[0] ? `Lanjut: ${nextUp[0].it.title}.` : 'Semua agenda hari ini selesai. Selamat! 🎉');
  };
  const [clock, setClock] = useState(new Date());
  useEffect(()=>{ if (!live) return; const t = setInterval(()=>setClock(new Date()), 15000); return ()=>clearInterval(t); }, [live]);

  if (loading) return (
    <div>
      <div className="mod-hero mb-4"><Shim h="12px" w="160px"/><Shim h="34px" w="240px"/><Shim h="14px" w="70%"/></div>
      <p className="text-center text-sm mb-4" style={{color:'var(--sage)'}}>✨ Menyusun rundown hari-H…</p>
      {[1,2,3,4].map(i=><div key={i} className="mod-item mb-3"><div style={{flex:1}}><Shim w="25%"/><Shim h="18px" w="55%"/><Shim w="40%"/></div></div>)}
    </div>
  );

  return (
    <div>
      <ModHero eyebrow="Janji Suci Rundown" title="Rundown Hari H"
        desc="Susun alur acara, jam kegiatan, PIC, vendor terkait, lokasi, dan status eksekusi di hari pernikahan."
        actions={[
          {label:'Tambah Agenda', primary:true, onClick:openNew},
          {label:'Mode Hari H', onClick:()=>setLive(true), disabled:!all.length},
          {label:'JPG', onClick:()=>exportAs('jpg'), disabled:exporting||!rundown.length},
          {label:'PDF', onClick:()=>exportAs('pdf'), disabled:exporting||!rundown.length},
        ]}
        goPage={goPage}/>
      {exporting && <p className="text-xs mb-3" style={{color:'#9db09f'}}>⏳ Sedang menyiapkan file export…</p>}

      {beda && (
        <div className="grid grid-cols-2 gap-2 mb-4 lg:max-w-xl">
          {events.map(ev=>{
            const on = activeDay===ev.key;
            const n = rundown.filter(it=>dayOf(it)===ev.key).length;
            return (
              <button key={ev.key} onClick={()=>setActiveDay(ev.key)} className="text-left rounded-2xl px-4 py-3 transition-all"
                style={{border: on?'2px solid var(--sage-dark)':'1.5px solid var(--sage-mid)', background: on?'var(--sage-dark)':'white', cursor:'pointer'}}>
                <span className="block text-[10px] font-bold tracking-widest uppercase" style={{color: on?'rgba(255,255,255,.75)':'var(--sage)'}}>Hari {ev.short}</span>
                <span className="block text-sm font-bold mt-0.5" style={{color: on?'white':'var(--sage-deep)'}}>{fmtDayShort(ev.date)}</span>
                <span className="block text-[11px] mt-0.5" style={{color: on?'rgba(255,255,255,.75)':'#9db09f'}}>{n} agenda{ev.venue?` · ${ev.venue}`:''}</span>
              </button>
            );
          })}
        </div>
      )}

      <StatGrid items={[
        {label:'Total Agenda', value:all.length, sub: beda ? `Hari ${activeEv.short.toLowerCase()}` : 'Semua sesi acara'},
        {label:'Siap', value:count('siap'), sub:'Agenda siap jalan'},
        {label:'Berlangsung', value:count('berlangsung'), sub:'Sedang berjalan', color: count('berlangsung')?'#2f63a6':null},
        {label:'Selesai', value:doneCount, sub:`${progress}% progress`},
        {label:'Bermasalah', value:count('bermasalah'), sub:'Perlu perhatian', color: count('bermasalah')?'var(--rust)':null},
      ]}/>

      <FilterBar search={search} setSearch={setSearch} placeholder="Cari agenda, lokasi, PIC…" selects={[
        {value:fStatus, set:setFStatus, label:'Status', options:[['semua','Semua status'], ...Object.entries(R_STATUS_LABEL).map(([k,l])=>[k,l[0].toUpperCase()+l.slice(1)])]},
        {value:fLok, set:setFLok, label:'Lokasi', options:[['semua','Semua lokasi'], ...lokasiOpts.map(l=>[l,l])]},
        {value:fPic, set:setFPic, label:'PIC', options:[['semua','Semua PIC'], ...picOpts.map(l=>[l,l])]},
      ]}/>

      {dayItems.length===0 ? (
        <EmptyMod icon="🕰️" text={beda ? `Belum ada agenda untuk hari ${activeEv.short.toLowerCase()}.` : 'Rundown belum tersedia.'} action={{label:'Tambah Agenda', onClick:openNew}}/>
      ) : shown.length===0 ? (
        <EmptyMod icon="🔍" text="Tidak ada agenda yang cocok dengan filter."/>
      ) : (
        <div className="space-y-3">
          {shown.map(({it,i,pos})=>{
            const st = rStatus(it); const end = endOf(pos); const pr = it.prioritas || 'sedang';
            return (
              <div key={i} className="flex gap-2 lg:gap-3 items-start">
                <div className={`tl-time ${st==='berlangsung'?'live':''}`} style={{marginTop:'18px'}}>{it.time||'--:--'}</div>
                <div style={{flex:1,minWidth:0}}>
                  <ModItem accent={R_ACCENT[st]}
                    chips={<><Chip tone={R_STATUS_TONE[st]}>{R_STATUS_LABEL[st]}</Chip><Chip tone={prioTone(pr)}>{pr}</Chip></>}
                    title={it.title||'Agenda tanpa nama'} titleColor={st==='selesai'?'#23854a':null}
                    meta={[`${it.time||'--:--'}${end?` – ${end}`:''}`, it.lokasi && `Lokasi: ${it.lokasi}`, it.pic && `PIC: ${it.pic}`]}
                    desc={it.note}
                    actions={[
                      st==='berlangsung' ? {label:'Selesai', primary:true, onClick:()=>setStatus(i,'selesai','Agenda selesai')}
                        : st==='selesai' ? {label:'Ulangi', onClick:()=>setStatus(i,'belum','Agenda dibuka lagi')}
                        : {label:'Mulai', primary:true, onClick:()=>setStatus(i,'berlangsung','Agenda dimulai')},
                      st!=='siap' && st!=='selesai' && {label:'Siap', onClick:()=>setStatus(i,'siap','Agenda siap')},
                      st!=='bermasalah' && st!=='selesai' && {label:'Bermasalah', onClick:()=>setStatus(i,'bermasalah','Agenda ditandai bermasalah')},
                      {label:'Edit', onClick:()=>openEdit(i)},
                      {label:'Hapus', danger:true, onClick:()=>remove(i)},
                    ]}/>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Modal open={!!draft} title={draft?.__new ? 'Tambah Agenda' : 'Edit Agenda'} sub="Atur jam, lokasi, PIC, dan status eksekusi agenda."
        onClose={()=>setDraft(null)} onSave={commit} saveLabel={draft?.__new ? 'Tambah Agenda' : 'Simpan Perubahan'}>
        {draft && (
          <div className="mod-form">
            <Fld label="Nama Kegiatan" span2><TextIn value={draft.title} onChange={v=>setD('title',v)} placeholder="Contoh: Akad nikah"/></Fld>
            {beda && <Fld label="Hari" span2><Sel value={draft.hari||'akad'} onChange={v=>setD('hari',v)} options={events.map(e=>[e.key,`Hari ${e.short} — ${fmtDayShort(e.date)}`])}/></Fld>}
            <Fld label="Jam Mulai"><TimePicker value={draft.time} onChange={v=>setD('time',v)} placeholder="08:00"/></Fld>
            <Fld label="Jam Selesai" hint="Kosongkan untuk otomatis sampai agenda berikutnya."><TimePicker value={draft.endTime} onChange={v=>setD('endTime',v)} placeholder="09:00"/></Fld>
            <Fld label="Lokasi"><TextIn value={draft.lokasi} onChange={v=>setD('lokasi',v)} placeholder="Contoh: Area akad"/></Fld>
            <Fld label="PIC / Vendor"><TextIn value={draft.pic} onChange={v=>setD('pic',v)} placeholder="Contoh: WO, MC, Fotografer"/></Fld>
            <Fld label="Status"><Sel value={draft.status} onChange={v=>setD('status',v)} options={Object.entries(R_STATUS_LABEL).map(([k,l])=>[k,l[0].toUpperCase()+l.slice(1)])}/></Fld>
            <Fld label="Prioritas"><Sel value={draft.prioritas} onChange={v=>setD('prioritas',v)} options={[['tinggi','Tinggi'],['sedang','Sedang'],['rendah','Rendah']]}/></Fld>
            <Fld label="Catatan / Perlengkapan" span2><Txt value={draft.note} onChange={v=>setD('note',v)} placeholder="Cue, perlengkapan, atau plan B"/></Fld>
          </div>
        )}
      </Modal>

      {live && (
        <div className="mod-overlay" style={{background:'rgba(20,32,22,.86)'}}>
          <div className="w-full max-w-2xl" style={{color:'white'}}>
            <div className="flex items-center justify-between mb-5 px-1">
              <div>
                <p className="text-[11px] font-bold tracking-[.22em] uppercase" style={{color:'#E9D9BC'}}>Mode Hari H{beda?` · ${activeEv.short}`:''}</p>
                <p className="font-serif italic text-2xl">{clock.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</p>
              </div>
              <button onClick={()=>setLive(false)} className="mod-btn mod-btn-sm" style={{background:'rgba(255,255,255,.12)',color:'white'}}>Keluar Mode Hari H</button>
            </div>
            <div className="prog-track mb-1" style={{background:'rgba(255,255,255,.15)'}}><div className="prog-fill" style={{width:`${progress}%`,background:'#E9D9BC'}}/></div>
            <p className="text-xs mb-5" style={{color:'rgba(255,255,255,.65)'}}>{doneCount} dari {all.length} agenda selesai</p>
            {cur ? (
              <div className="rounded-3xl p-6 lg:p-8 mb-4" style={{background:'white',color:'var(--sage-deep)'}}>
                <div className="flex flex-wrap gap-2 mb-3"><Chip tone={R_STATUS_TONE[rStatus(cur.it)]}>{R_STATUS_LABEL[rStatus(cur.it)]}</Chip>{cur.it.pic && <Chip>PIC: {cur.it.pic}</Chip>}</div>
                <p className="text-sm font-bold mb-1" style={{color:'var(--gold)'}}>{cur.it.time}{endOf(curPos)?` – ${endOf(curPos)}`:''}</p>
                <p className="font-serif text-3xl lg:text-4xl font-bold mb-2">{cur.it.title}</p>
                <p className="text-sm mb-1" style={{color:'#7a9482'}}>{cur.it.lokasi?`Lokasi: ${cur.it.lokasi}`:''}</p>
                {cur.it.note && <p className="mod-item-note">{cur.it.note}</p>}
                <div className="flex flex-wrap gap-2 mt-5">
                  {rStatus(cur.it)!=='berlangsung'
                    ? <button onClick={()=>setStatus(cur.i,'berlangsung','Agenda dimulai')} className="mod-btn mod-btn-primary" style={{padding:'13px 22px',fontSize:'14px'}}>Mulai Sekarang</button>
                    : <button onClick={finishAndNext} className="mod-btn mod-btn-primary" style={{padding:'13px 22px',fontSize:'14px'}}>Selesai & Lanjut</button>}
                  {rStatus(cur.it)!=='bermasalah' && <button onClick={()=>setStatus(cur.i,'bermasalah','Agenda ditandai bermasalah')} className="mod-btn" style={{padding:'13px 18px',background:'var(--rust-light)',color:'var(--rust)'}}>Ada Masalah</button>}
                </div>
              </div>
            ) : (
              <div className="rounded-3xl p-8 mb-4 text-center" style={{background:'white',color:'var(--sage-deep)'}}>
                <p className="text-4xl mb-2">🎉</p><p className="font-serif text-2xl font-bold">Semua agenda selesai</p>
                <p className="text-sm mt-1" style={{color:'#7a9482'}}>Selamat menempuh hidup baru!</p>
              </div>
            )}
            {nextUp.length>0 && (
              <div className="rounded-2xl p-4" style={{background:'rgba(255,255,255,.08)'}}>
                <p className="text-[11px] font-bold tracking-widest uppercase mb-2" style={{color:'rgba(255,255,255,.6)'}}>Berikutnya</p>
                {nextUp.map(x=>(
                  <div key={x.i} className="flex gap-3 py-1.5 text-sm"><b style={{color:'#E9D9BC',width:'48px'}}>{x.it.time}</b><span>{x.it.title}</span>{x.it.pic && <span style={{color:'rgba(255,255,255,.55)'}}>· {x.it.pic}</span>}</div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── Tabel cetak tersembunyi — untuk export JPG/PDF ── */}
      <div style={{height:0, overflow:'hidden'}} aria-hidden="true">
        <div ref={printRef} style={{width:'1000px', background:'white', fontFamily:"'DM Sans', sans-serif"}}>
          <PrintHead data={data} sub={`Rundown Acara Pernikahan — ${jadwalText(data)}`}/>
          <div style={{padding:'24px 40px 32px'}}>
            {(beda ? events.map(ev=>({ev, items: rundown.filter(it=>dayOf(it)===ev.key)})) : [{ev:null, items: rundown}]).map(({ev, items}, si)=>{
              const sorted = [...items].sort((a,b)=>rMin(a.time)-rMin(b.time));
              return (
                <div key={si} style={{marginTop: si>0 ? '26px' : 0}}>
                  {ev && (
                    <div style={{display:'flex',alignItems:'baseline',gap:'10px',marginBottom:'10px'}}>
                      <span style={{fontFamily:"'Playfair Display', serif", fontSize:'17px', fontWeight:700, color:'#263A29'}}>Hari {ev.short}</span>
                      <span style={{fontSize:'12.5px',color:'#7a9482'}}>{fmtDate(ev.date)}{ev.venue?` · ${ev.venue}`:''}</span>
                    </div>
                  )}
                  <table style={{width:'100%',borderCollapse:'collapse'}}>
                    <thead><tr>{['No','Waktu','Kegiatan','Lokasi','PIC','Catatan','Status'].map(h=><th key={h} style={pth}>{h}</th>)}</tr></thead>
                    <tbody>{sorted.map((it,i)=>(
                      <tr key={i}>
                        <td style={ptd(i)}>{i+1}</td>
                        <td style={{...ptd(i),fontWeight:700,color:'#47654A',whiteSpace:'nowrap'}}>{it.time||'—'}{(it.endTime||sorted[i+1]?.time)?` – ${it.endTime||sorted[i+1].time}`:''}</td>
                        <td style={{...ptd(i),fontWeight:600}}>{it.title||'—'}</td><td style={ptd(i)}>{it.lokasi||'—'}</td>
                        <td style={ptd(i)}>{it.pic||'—'}</td><td style={{...ptd(i),color:'#7a9482'}}>{it.note||'—'}</td><td style={ptd(i)}>{R_STATUS_LABEL[rStatus(it)]}</td>
                      </tr>))}</tbody>
                  </table>
                </div>
              );
            })}
            <div style={{marginTop:'20px',textAlign:'center',fontSize:'10px',color:'#9db09f'}}>Dibuat dengan Janji Suci Wedding Planner · {new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ DOKUMEN PAGE ═══════════════ */
const DOC_CATS = ['Identitas','KUA/Catatan Sipil','Surat Resmi','Kesehatan','Foto','Keagamaan','Vendor','Lainnya'];

const KUA_TEMPLATE = [
  ['Identitas','Fotokopi KTP kedua calon pengantin',60,'Kedua mempelai','Siapkan juga KTP asli saat pendaftaran.'],
  ['Identitas','Fotokopi Kartu Keluarga (KK)',60,'Kedua mempelai','Pastikan data di KK sudah sesuai dengan KTP.'],

  ['Foto','Pas foto 2x3 – 4 lembar (latar biru)',50,'Kedua mempelai','Siapkan untuk calon pengantin wanita dan pria.'],
  ['Foto','Pas foto 4x6 – 2 lembar (latar biru)',50,'Kedua mempelai','Siapkan untuk calon pengantin wanita dan pria.'],
